<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Algebra Calculator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%237c5cbf'/><line x1='6' y1='6' x2='18' y2='18' stroke='white' stroke-width='3.4' stroke-linecap='round'/><line x1='18' y1='6' x2='6' y2='18' stroke='white' stroke-width='3.4' stroke-linecap='round'/></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d0d1a; --surface:#13131f; --card:#1a1a2e; --border:#252540;
      --accent:#7c5cbf; --accent-l:#9b7de8; --text:#e8e8f0; --dim:#6b6b8a;
      --green:#4fc3a1; --blue:#79b8ff; --red:#ff6b8a; --gold:#e8c36a;
    }
    body {
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
      min-height:100vh; display:flex; flex-direction:column;
    }

    /* ── Header ── */
    header {
      background:linear-gradient(135deg,#1a1a2e,#0f0f28);
      border-bottom:1px solid var(--border); padding:14px 28px;
      display:flex; align-items:center; gap:14px; flex-wrap:wrap; position:sticky; top:0; z-index:20;
    }
    @media (max-width:560px) {
      header { padding:12px 16px; gap:10px; }
      .header-right { width:100%; margin-left:0; flex-wrap:wrap; }
    }
    .logo {
      width:42px; height:42px;
      background:linear-gradient(135deg,var(--accent),var(--accent-l));
      border-radius:11px; display:flex; align-items:center; justify-content:center;
      font-size:1.5rem; font-weight:900; line-height:1; flex-shrink:0;
    }
    header h1 { font-size:1.25rem; font-weight:700; }
    header p  { font-size:.75rem; color:var(--dim); margin-top:1px; }
    .header-right { margin-left:auto; display:flex; gap:8px; align-items:center; }

    .btn {
      background:var(--card); border:1px solid var(--border); color:var(--text);
      padding:6px 14px; border-radius:7px; cursor:pointer; font-size:.82rem;
      transition:background .15s,border-color .15s; white-space:nowrap;
    }
    .btn:hover { background:var(--accent); border-color:var(--accent); }

    /* Mode toggle (Real / Complex) */
    .mode-toggle {
      display:flex; background:var(--card); border:1px solid var(--border);
      border-radius:8px; overflow:hidden; font-size:.8rem;
    }
    .mode-toggle button {
      background:none; border:none; color:var(--dim); cursor:pointer;
      padding:6px 12px; font-size:.8rem; transition:background .15s,color .15s;
    }
    .mode-toggle button.active { background:var(--accent); color:#fff; font-weight:600; }

    .app-row {
      flex:1; min-width:0; max-width:1180px; width:100%; margin:14px auto 0; padding:0 18px;
      display:flex; gap:16px; align-items:stretch;
    }
    main { flex:1; min-width:0; padding:0 0 20px; }

    /* ── Variables sidebar ── */
    .vars-panel {
      width:200px; flex-shrink:0; background:var(--surface); border:1px solid var(--border);
      border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:8px;
    }
    .vars-panel h2 { font-size:.66rem; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); }
    .vars-list { display:flex; flex-direction:column; gap:6px; }
    .var-item {
      background:var(--card); border:1px solid var(--border); border-radius:8px;
      padding:7px 10px; font-size:.85rem; display:flex; justify-content:space-between;
      gap:8px; align-items:baseline;
    }
    .var-item .var-name { color:var(--green); font-style:italic; font-weight:700; flex-shrink:0; }
    .var-item .var-val  { color:var(--blue); font-family:'Cascadia Code','Consolas',monospace; text-align:right; word-break:break-word; }
    .vars-empty { font-size:.74rem; color:var(--dim); font-style:italic; }

    /* ── Calculator card ── */
    .calc-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:14px; overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.4);
    }
    .calc-titlebar {
      background:var(--card); padding:9px 16px; display:flex; align-items:center; gap:6px;
      border-bottom:1px solid var(--border);
    }
    .calc-fname { font-size:.78rem; color:var(--dim); font-weight:600; }

    .lines { padding:12px 12px 6px; max-height:380px; overflow-y:auto; overflow-x:hidden; }
    .line {
      display:flex; align-items:center; gap:10px; min-height:50px;
      padding:5px 10px; border-radius:8px; border:1px solid transparent;
      margin-bottom:4px; transition:border-color .12s,background .12s;
    }
    .line:focus-within { background:rgba(124,92,191,.07); border-color:var(--accent); }
    .line.is-error  { border-color:rgba(255,107,138,.4); }
    .line.is-result { border-color:rgba(79,195,161,.2); }

    .lnum { font-size:.72rem; color:var(--dim); font-family:'Consolas',monospace;
            min-width:22px; text-align:right; user-select:none; flex-shrink:0; }

    .ldrag {
      flex-shrink:0; width:14px; text-align:center; color:var(--dim); font-size:.95rem;
      cursor:grab; user-select:none; line-height:1; opacity:.55; transition:opacity .12s;
    }
    .ldrag:hover { opacity:1; }
    .ldrag:active { cursor:grabbing; }
    .line.dragging { opacity:.4; }
    .line.drag-over-top    { box-shadow:inset 0 2px 0 var(--accent); }
    .line.drag-over-bottom { box-shadow:inset 0 -2px 0 var(--accent); }

    /* MathQuill field */
    .mq-field {
      flex:1; min-width:0; font-size:1.15rem; color:var(--text);
      padding:4px 2px; border:none !important; box-shadow:none !important;
    }
    .mq-field.mq-editable-field { border:none; }
    .mq-field .mq-cursor { border-color:var(--accent-l); }
    .mq-field.mq-focused { box-shadow:none !important; outline:none; }
    /* placeholder for empty field */
    .mq-empty::after {
      content:'expression or equation…'; color:var(--dim);
      font-family:-apple-system,system-ui,sans-serif; font-size:.9rem;
      position:absolute; pointer-events:none;
    }

    .larrow { color:var(--dim); font-size:.9rem; flex-shrink:0; min-width:14px; }
    .lresult {
      text-align:right; max-width:340px; flex-shrink:0; font-size:.95rem;
      word-break:break-word; font-family:'Cascadia Code','Consolas',monospace;
      display:flex; flex-direction:column; align-items:flex-end; gap:2px;
    }
    .lresult-or { font-size:.62rem; text-transform:uppercase; letter-spacing:.5px; color:var(--dim); }
    .lresult.num { color:var(--blue); }
    .lresult.sym { color:var(--gold); }
    .lresult.ok  { color:var(--green); }
    .lresult.err { color:var(--red); font-size:.78rem; }
    .lresult .katex { font-size:1.05rem; }

    .ldel {
      background:none; border:none; cursor:pointer; color:transparent;
      font-size:.82rem; padding:2px 5px; border-radius:4px;
      transition:color .12s; flex-shrink:0;
    }
    .line:hover .ldel, .line:focus-within .ldel { color:var(--dim); }
    .ldel:hover { color:var(--red)!important; }

    .add-line {
      width:100%; background:none; border:1.5px dashed var(--border);
      color:var(--dim); padding:9px 12px; border-radius:8px; cursor:pointer;
      font-size:.83rem; margin:3px 0 12px;
      transition:border-color .15s,color .15s,background .15s;
      display:flex; align-items:center; justify-content:center; gap:6px;
    }
    .add-line:hover { border-color:var(--accent); color:var(--accent-l); background:rgba(124,92,191,.05); }

    .status {
      padding:8px 16px; background:var(--card); border-top:1px solid var(--border);
      display:flex; gap:20px; flex-wrap:wrap; font-size:.72rem; color:var(--dim);
    }
    .status b { color:var(--text); font-weight:600; }

    /* ── Virtual keyboard (Desmos-style bottom pop-up, always docked) ── */
    main { padding-bottom:calc(min(46vh,420px) + 24px); }
    .kb-wrap {
      position:fixed; left:0; right:0; bottom:0; z-index:30;
      background:var(--surface); border-top:1px solid var(--border);
      box-shadow:0 -10px 40px rgba(0,0,0,.5);
      max-height:min(46vh,420px); display:flex; flex-direction:column;
    }
    .kb-hdr {
      background:var(--card); padding:8px 18px;
      display:flex; justify-content:space-between; align-items:center;
      font-size:.8rem; font-weight:600; user-select:none; border-bottom:1px solid var(--border);
      flex-shrink:0; max-width:960px; margin:0 auto; width:100%;
    }
    .kb-body {
      padding:10px 14px 12px; display:flex; flex-direction:column; gap:8px;
      overflow-y:auto; flex:1; min-height:0;
      max-width:960px; margin:0 auto; width:100%; box-sizing:border-box;
    }
    @media (max-width:560px) {
      main { padding-bottom:calc(48vh + 20px); }
      .kb-wrap { max-height:48vh; }
      .app-row { flex-direction:column; padding:0 16px; }
      .vars-panel { width:100%; }
      .vars-list { flex-direction:row; flex-wrap:wrap; }
      .var-item { flex:0 0 auto; }
    }
    /* Desktop: the whole page never scrolls — only the line list does */
    @media (min-width:561px) {
      html, body { height:100%; overflow:hidden; }
      .app-row { min-height:0; overflow:hidden; }
      main { flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
      .calc-card { flex:1; min-height:0; display:flex; flex-direction:column; }
      .lines { flex:1; min-height:0; }
      .vars-panel { align-self:stretch; overflow-y:auto; }
    }

    .kb-section-label { font-size:.62rem; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin-bottom:-4px; }
    .kb-row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .kb-sep { width:1px; align-self:stretch; background:var(--border); margin:2px 4px; flex-shrink:0; }

    .kb {
      background:var(--card); border:1px solid var(--border); color:var(--text);
      border-radius:7px; cursor:pointer; font-size:.92rem; padding:8px 0;
      min-width:42px; text-align:center; transition:background .12s,border-color .12s;
      flex-shrink:0; user-select:none;
      font-family:'Cambria Math','Cambria','Times New Roman',serif;
    }
    .kb:hover  { background:var(--accent); border-color:var(--accent); }
    .kb:active { filter:brightness(1.25); }
    .kb.num    { color:var(--blue); }
    .kb.op     { color:var(--gold); }
    .kb.fn     { color:var(--accent-l); font-size:.82rem; }
    .kb.var    { color:var(--green); font-style:italic; }
    .kb.del    { color:var(--red); }
    .kb.wide   { min-width:64px; }
    .kb-frac { display:inline-flex; flex-direction:column; align-items:center; line-height:1.15; font-size:.85em; }
    .kb-frac-bar { width:100%; height:1px; background:currentColor; margin:2px 0; }
    .kb.special {
      background:linear-gradient(135deg,var(--accent),var(--accent-l));
      color:#fff; border-color:transparent; font-weight:600; min-width:auto; padding:8px 16px;
    }
    .kb.special:hover { filter:brightness(1.1); }

    /* ── Desmos-style keypad grid ── */
    .kb-desmos { display:flex; gap:10px; flex-wrap:wrap; align-items:stretch; }
    .kb-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; min-width:0; flex:1 1 200px; }
    .kb-grid .kb { width:100%; min-width:0; padding:9px 0; font-size:.95rem; }
    .kb-grid-num .kb.op { color:var(--gold); }
    .kb-side { display:flex; flex-direction:column; gap:6px; min-width:88px; }
    .kb-side .kb { flex:1; min-width:0; width:100%; font-size:.95rem; }
    .kb-side-nav { display:flex; gap:6px; }
    .kb-side-nav .kb { flex:1; }
    .kb.enter {
      background:linear-gradient(135deg,var(--accent),var(--accent-l));
      color:#fff; border-color:transparent; font-weight:600; font-size:.9rem;
    }
    .kb.enter:hover { filter:brightness(1.1); }
    @media (max-width:560px) {
      .kb-desmos { flex-direction:column; gap:8px; }
      .kb-grid { flex-basis:auto; }
      .kb-grid .kb { padding:12px 0; font-size:1.05rem; }
      .kb-side { flex-direction:row; min-width:auto; }
      .kb-side-nav { flex:1; }
      .kb.enter { flex:2; }
    }

    /* ── Function palette modal ── */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px);
      display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
    }
    .modal-overlay.show { display:flex; }
    .modal {
      background:var(--surface); border:1px solid var(--border); border-radius:16px;
      max-width:640px; width:100%; max-height:85vh; overflow-y:auto;
      box-shadow:0 20px 70px rgba(0,0,0,.6);
    }
    .modal-hdr {
      display:flex; justify-content:space-between; align-items:center;
      padding:16px 22px; border-bottom:1px solid var(--border);
      position:sticky; top:0; background:var(--surface); z-index:1;
    }
    .modal-hdr h2 { font-size:1.1rem; }
    .modal-close { background:none; border:none; color:var(--dim); font-size:1.4rem; cursor:pointer; line-height:1; }
    .modal-close:hover { color:var(--red); }
    .modal-body { padding:10px 22px 22px; }
    .pal-cat { margin-top:16px; }
    .pal-cat h3 { font-size:.66rem; text-transform:uppercase; letter-spacing:.9px; color:var(--accent-l); margin-bottom:10px; }
    .pal-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; }
    .pal-item {
      background:var(--card); border:1px solid var(--border); border-radius:9px;
      padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:2px;
      transition:background .12s,border-color .12s;
    }
    .pal-item:hover { background:var(--accent); border-color:var(--accent); }
    .pal-item .pal-sym { font-size:1.05rem; font-family:'Cambria Math',serif; }
    .pal-item .pal-name { font-size:.68rem; color:var(--dim); }
    .pal-item:hover .pal-name { color:#eee; }

    #toast {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      background:var(--accent); color:#fff; padding:8px 20px; border-radius:8px;
      font-size:.85rem; opacity:0; transition:opacity .3s; pointer-events:none; z-index:100;
    }
    #toast.show { opacity:1; }

    @media (max-width:600px){ .lresult{ max-width:150px; } }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round">
      <line x1="5" y1="5" x2="19" y2="19"/>
      <line x1="19" y1="5" x2="5" y2="19"/>
    </svg>
  </div>
  <div>
    <h1>Algebra Calculator</h1>
    <p>Live math input · exact answers · multi-line</p>
  </div>
  <div class="header-right">
    <div class="mode-toggle" title="Real mode: i is a variable, √(−1) is undefined. Complex mode: i is the imaginary unit.">
      <button id="modeReal" class="active" onclick="setComplex(false)">ℝ Real</button>
      <button id="modeComplex" onclick="setComplex(true)">ℂ Complex</button>
    </div>
    <div class="mode-toggle" title="Exact: answers like √3 stay symbolic. Decimal: shown as 1.732050808 instead.">
      <button id="modeExact" class="active" onclick="setDecimal(false)">√ Exact</button>
      <button id="modeDecimal" onclick="setDecimal(true)">≈ Decimal</button>
    </div>
    <button class="btn" onclick="clearAll()">Clear</button>
  </div>
</header>

<div class="app-row">
  <aside class="vars-panel" id="varsPanel">
    <h2>Variables</h2>
    <div class="vars-list" id="varsList">
      <div class="vars-empty">No variables yet</div>
    </div>
  </aside>
  <main>
  <div class="calc-card">
    <div class="calc-titlebar">
      <span class="calc-fname">Algebra Calculator</span>
    </div>
    <div class="lines" id="lines"></div>
    <div class="status">
      <span>Lines: <b id="lineCount">0</b></span>
      <span>Mode: <b id="modeLabel">Real</b></span>
      <span><b>Enter</b> new line · <b>↑↓</b> navigate · type <b>/</b> for fraction, <b>^</b> for power, <b>sqrt</b> for √</span>
    </div>
  </div>

  <!-- ── Virtual keyboard ── -->
  <div class="kb-wrap" id="kbWrap">
    <div class="kb-hdr">
      <span>⌨️ Keyboard</span>
    </div>
    <div class="kb-body" id="kbBody">

      <div class="kb-section-label">Keypad</div>
      <div class="kb-desmos">
        <div class="kb-grid kb-grid-misc">
          <button class="kb op" onclick="K.pow2()">x²</button>
          <button class="kb op" onclick="K.cmd('^')">xʸ</button>
          <button class="kb op" onclick="K.cmd('\\sqrt')">√</button>
          <button class="kb op" onclick="K.nthroot()">ⁿ√</button>

          <button class="kb op" onclick="K.type('(')">(</button>
          <button class="kb op" onclick="K.type(')')">)</button>
          <button class="kb op" onclick="K.cmd('\\frac')"><span class="kb-frac"><span>a</span><span class="kb-frac-bar"></span><span>b</span></span></button>
          <button class="kb op" onclick="K.abs()">|x|</button>

          <button class="kb op" onclick="K.type('pi')">π</button>
          <button class="kb op" onclick="K.type('e')">e</button>
          <button class="kb var" onclick="K.cmd('\\theta')">θ</button>
          <button class="kb del" onclick="K.backspace()">⌫</button>
        </div>

        <div class="kb-grid kb-grid-num">
          <button class="kb num" onclick="K.type('7')">7</button>
          <button class="kb num" onclick="K.type('8')">8</button>
          <button class="kb num" onclick="K.type('9')">9</button>
          <button class="kb op"  onclick="K.type('/')">÷</button>

          <button class="kb num" onclick="K.type('4')">4</button>
          <button class="kb num" onclick="K.type('5')">5</button>
          <button class="kb num" onclick="K.type('6')">6</button>
          <button class="kb op"  onclick="K.type('*')">×</button>

          <button class="kb num" onclick="K.type('1')">1</button>
          <button class="kb num" onclick="K.type('2')">2</button>
          <button class="kb num" onclick="K.type('3')">3</button>
          <button class="kb op"  onclick="K.type('-')">−</button>

          <button class="kb num" onclick="K.type('0')">0</button>
          <button class="kb num" onclick="K.type('.')">.</button>
          <button class="kb op"  onclick="K.type('=')">=</button>
          <button class="kb op"  onclick="K.type('+')">+</button>
        </div>

        <div class="kb-side">
          <div class="kb-side-nav">
            <button class="kb" onclick="K.left()">←</button>
            <button class="kb" onclick="K.right()">→</button>
          </div>
          <button class="kb enter" onclick="K.enter()">⏎ Enter</button>
        </div>
      </div>

      <div class="kb-section-label">Functions</div>
      <div class="kb-row">
        <button class="kb fn" onclick="K.fn('sin')">sin</button>
        <button class="kb fn" onclick="K.fn('cos')">cos</button>
        <button class="kb fn" onclick="K.fn('tan')">tan</button>
        <button class="kb fn" onclick="K.fn('ln')">ln</button>
        <button class="kb fn" onclick="K.log10()">log</button>
        <button class="kb fn" onclick="K.logBase()">log_b</button>
        <button class="kb fn" onclick="K.type('factorial(')">n!</button>
        <div class="kb-sep"></div>
        <button class="kb special" onclick="openPalette()">∑ &nbsp;More functions…</button>
      </div>

      <div class="kb-section-label">Variables</div>
        <div class="kb-row">
        <button class="kb var" onclick="K.type('x')">x</button>
        <button class="kb var" onclick="K.type('y')">y</button>
        <button class="kb var" onclick="K.type('z')">z</button>
        <button class="kb var" onclick="K.type('a')">a</button>
        <button class="kb var" onclick="K.type('b')">b</button>
        <button class="kb var" onclick="K.type('c')">c</button>
        <button class="kb var" onclick="K.type('d')">d</button>
        <button class="kb var" onclick="K.type('f')">f</button>
        <button class="kb var" onclick="K.type('g')">g</button>
        <button class="kb var" onclick="K.type('k')">k</button>
        <button class="kb var" onclick="K.type('m')">m</button>
        <button class="kb var" onclick="K.type('n')">n</button>
        <button class="kb var" onclick="K.type('p')">p</button>
        <button class="kb var" onclick="K.type('q')">q</button>
        <button class="kb var" onclick="K.type('r')">r</button>
        <button class="kb var" onclick="K.type('s')">s</button>
        <button class="kb var" onclick="K.type('t')">t</button>
        <button class="kb var" onclick="K.type('u')">u</button>
        <button class="kb var" onclick="K.type('v')">v</button>
        <button class="kb var" onclick="K.type('w')">w</button>
        <button class="kb var" onclick="K.cmd('\\theta')">θ</button>
        <button class="kb var" onclick="K.cmd('\\alpha')">α</button>
        <button class="kb var" onclick="K.cmd('\\beta')">β</button>
        <button class="kb var" onclick="K.cmd('\\lambda')">λ</button>
        <button class="kb var" onclick="K.cmd('\\mu')">μ</button>
        <button class="kb var" onclick="K.cmd('\\omega')">ω</button>
      </div>

    </div>
  </div>
  </main>
</div>

<!-- ── Function palette modal ── -->
<div class="modal-overlay" id="palette" onclick="if(event.target===this)closePalette()">
  <div class="modal">
    <div class="modal-hdr">
      <h2>∑ Function Palette</h2>
      <button class="modal-close" onclick="closePalette()">✕</button>
    </div>
    <div class="modal-body" id="paletteBody"><!-- filled by JS --></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathquill@0.10.1/build/mathquill.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Solve.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mathjs@13/lib/browser/math.min.js"></script>

<script>
/* ============================================================
   Globals
============================================================ */
const MQ = MathQuill.getInterface(2);
const IVAR = 'ireservedvar';          // stand-in for `i` when in Real mode (no underscore: nerdamer's toTeX() treats "_" as a LaTeX subscript separator, which broke disp()'s literal-string replace)

/* mathjs treats these bare single letters as built-in unit symbols (byte, gram,
   hour, liter, meter, second, tonne, ampere, coulomb, farad, henry, joule,
   kelvin, newton, siemens, tesla, volt, watt) instead of algebraic variables —
   e.g. math.evaluate('2*t') silently returns "2 tonnes", and 't+1' throws a raw
   "Unexpected type of argument" error. Also covers uppercase E, which mathjs
   quietly aliases to Euler's number — but unlike lowercase e (a near-universal
   constant), uppercase E is overwhelmingly used for "Energy" in algebra/physics,
   so it's treated as a free variable here rather than a locked constant.
   Alias them all the same way `i` is aliased, unconditionally (this isn't a
   real/complex-mode thing, it's a mathjs quirk). */
const UNIT_ALIASES = {};
for (const letter of ['b','g','h','l','m','s','t','A','B','C','E','F','H','J','K','L','N','S','T','V','W']) {
  UNIT_ALIASES[letter] = letter + 'ReservedVar';
}
let complexMode = false;
let decimalMode = false;   // Exact (√3) vs Decimal (1.732050808) display for exact-form roots
let numScope = {}, varNames = new Set();
let knownVars = new Map();   // name -> {text} for the sidebar; separate from numScope since
                              // ambiguous (multi-valued) variables can't be substituted elsewhere
                              // but should still show up so the user can see "we found these values"
let primaryDefLine = new Map();   // varName -> the one line that "owns" plain assignment to it
let knownFunctionNames = new Set();   // single-letter names with a f(x)=... definition on some line —
                                       // lets latexToExpr tell "f(x)" (call) apart from "f*(x)" (multiply)
let primaryFuncDefLine = new Map();   // funcName -> the one line that "owns" its f(x)=... definition
let activeMQ = null, activeLine = null;

/* MathQuill mutates the config object it's given (rewrites .handlers into its
   own internal shape), so every field needs a fresh object — sharing one
   across fields silently breaks the handlers for every field but the first. */
/* Typing "->" (e.g. inside a limit's "h->0") turns into a proper arrow \to,
   since there's otherwise no way to type it by hand — only the Function
   Palette's Limit button could produce one. Diffs the latex before/after
   each edit to find a single freshly-typed ">" preceded by "-", then swaps
   just those two characters for \to via backspace+write so it works no
   matter where in the expression it happened (not just at the very end).
   Two MathQuill quirks to work around here:
   - handler callbacks get a freshly-wrapped `mq` object on every call, not
     the stable per-field reference — so it can't be used as a WeakMap key
     (every call would miss) or trusted to still work after this tick. Key
     off the (stable) line element instead, and re-resolve the real field
     reference (`line._mq`, set once at field creation) for later use.
   - mutating the field synchronously from inside its own edit handler is
     re-entrant — MathQuill's own keystroke processing silently reverts it
     once the handler returns — so the actual fix has to happen next tick. */
const lastLatexByLine = new WeakMap();
function autoArrow(mq) {
  const line = mq.el().closest('.line');
  const stableMQ = (line && line._mq) || mq;
  const key = line || mq;
  const newLatex = stableMQ.latex();
  const oldLatex = lastLatexByLine.get(key) || '';
  lastLatexByLine.set(key, newLatex);
  if (newLatex.length !== oldLatex.length + 1) return;
  let p = 0;
  while (p < oldLatex.length && oldLatex[p] === newLatex[p]) p++;
  if (newLatex[p] !== '>' || p === 0 || newLatex[p - 1] !== '-') return;
  if (oldLatex.slice(p) !== newLatex.slice(p + 1)) return;
  setTimeout(() => {
    stableMQ.keystroke('Backspace'); stableMQ.keystroke('Backspace'); stableMQ.write('\\to ');
    lastLatexByLine.set(key, stableMQ.latex());
    scheduleEval();
  }, 0);
}

function makeMQConfig() {
  return {
    spaceBehavesLikeTab: true,
    autoCommands: 'pi tau theta alpha beta gamma delta epsilon zeta eta iota kappa lambda mu nu xi rho sigma phi chi psi omega sqrt sum prod int infty',
    autoOperatorNames: 'sin cos tan sec csc cot arcsin arccos arctan sinh cosh tanh ln log exp abs sign floor ceil round gcd lcm mod det factor expand simplify factorial lim',
    handlers: {
      edit: mq => { autoArrow(mq); onFocusField(mq); scheduleEval(); },
      enter: mq => enterFrom(mq),
      upOutOf: mq => moveVert(mq, -1),
      downOutOf: mq => moveVert(mq, +1),
      deleteOutOf: (dir, mq) => { if (dir === MQ.L) backspaceEmpty(mq); },
    },
  };
}

/* ============================================================
   Boot
============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  fixSqrtScaling();
  buildPalette();
  setupDragReorder();
  for (let i = 0; i < 3; i++) addLine('', false);
  const f = document.querySelector('.mq-field');
  if (f && f.__mq) f.__mq.focus();
});

/* Drag a line's handle (⠿) to reorder — order matters for which line "owns"
   a variable/function definition (see primaryDefLine), so reordering can
   change results, not just cosmetics. Uses native HTML5 drag-and-drop,
   delegated on the container since lines are created/removed dynamically. */
function setupDragReorder() {
  const container = document.getElementById('lines');
  let dragSrc = null;

  container.addEventListener('dragstart', e => {
    const handle = e.target.closest('.ldrag');
    const line = handle && handle.closest('.line');
    if (!line) { e.preventDefault(); return; }
    dragSrc = line;
    line.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', '');
  });

  container.addEventListener('dragover', e => {
    if (!dragSrc) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const target = e.target.closest('.line');
    container.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(l => l.classList.remove('drag-over-top', 'drag-over-bottom'));
    if (!target || target === dragSrc) return;
    const before = (e.clientY - target.getBoundingClientRect().top) < target.offsetHeight / 2;
    target.classList.add(before ? 'drag-over-top' : 'drag-over-bottom');
  });

  container.addEventListener('drop', e => {
    if (!dragSrc) return;
    e.preventDefault();
    const target = e.target.closest('.line');
    if (target && target !== dragSrc) {
      const before = (e.clientY - target.getBoundingClientRect().top) < target.offsetHeight / 2;
      container.insertBefore(dragSrc, before ? target : target.nextSibling);
    }
    finishDrag();
  });

  container.addEventListener('dragend', finishDrag);

  function finishDrag() {
    if (!dragSrc) return;
    dragSrc.classList.remove('dragging');
    container.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(l => l.classList.remove('drag-over-top', 'drag-over-bottom'));
    dragSrc = null;
    renumber(); evaluateAll(); updateStatus();
  }
}

/* Fix MathQuill's broken scaleY on empty sqrt boxes */
function fixSqrtScaling() {
  const SEL = '.mq-sqrt-prefix, .mq-paren';
  function patch(el) {
    if (!el.classList || !(el.classList.contains('mq-sqrt-prefix') || el.classList.contains('mq-paren'))) return;
    const m = (el.style.transform || '').match(/scale\s*\([^,]+,\s*([-\d.]+)\)/);
    if (m && Math.abs(parseFloat(m[1])) < 0.5) el.style.transform = 'scale(1,1)';
  }
  new MutationObserver(muts => {
    muts.forEach(m => {
      if (m.type === 'attributes') { patch(m.target); }
      else m.addedNodes.forEach(n => { if (n.nodeType === 1) { patch(n); n.querySelectorAll(SEL).forEach(patch); } });
    });
  }).observe(document.body, { attributes: true, subtree: true, attributeFilter: ['style'], childList: true });
}

/* ============================================================
   Line management
============================================================ */
function addLine(latex = '', focus = true) {
  const container = document.getElementById('lines');
  const oldAdd = container.querySelector('.add-line');
  if (oldAdd) oldAdd.remove();

  const div = document.createElement('div');
  div.className = 'line';
  div.innerHTML = `
    <span class="ldrag" draggable="true" title="Drag to reorder">⠿</span>
    <span class="lnum">?</span>
    <span class="mq-field"></span>
    <span class="larrow"></span>
    <div class="lresult"></div>
    <button class="ldel" tabindex="-1" title="Remove">✕</button>`;
  container.appendChild(div);

  const addBtn = document.createElement('button');
  addBtn.className = 'add-line';
  addBtn.innerHTML = '＋ &nbsp;Add line';
  addBtn.onclick = () => addLine();
  container.appendChild(addBtn);

  const fieldEl = div.querySelector('.mq-field');
  const mq = MQ.MathField(fieldEl, makeMQConfig());
  fieldEl.__mq = mq;
  div._mq = mq;
  if (latex) mq.latex(latex);

  fieldEl.addEventListener('focusin', () => onFocusField(mq));
  fieldEl.addEventListener('mousedown', () => onFocusField(mq));
  div.querySelector('.ldel').addEventListener('click', () => deleteLine(div));

  renumber(); evaluateAll(); updateStatus();
  if (focus) setTimeout(() => mq.focus(), 0);
  return div;
}

function onFocusField(mq) {
  activeMQ = mq;
  activeLine = mq.el().closest('.line');
}

function deleteLine(line) {
  const lines = allLines();
  if (lines.length <= 1) { line._mq.latex(''); evaluateAll(); return; }
  const idx = lines.indexOf(line);
  const prev = lines[Math.max(0, idx - 1)];
  line.remove();
  renumber(); evaluateAll(); updateStatus();
  prev._mq.focus();
}

function clearAll() {
  document.getElementById('lines').innerHTML = '';
  addLine('', false);
  setTimeout(() => document.querySelector('.mq-field').__mq.focus(), 0);
}

/* ── inter-field navigation ──
   Note: MathQuill passes a freshly-wrapped API object into each handler call,
   not the original `mq` stored on the line, so comparing by reference (===)
   never matches. Use the reliably-tracked `activeLine` (set on focusin/mousedown
   with the original mq) to find the current line instead. */
function enterFrom(mq) {
  const lines = allLines();
  const idx = lines.indexOf(activeLine);
  if (idx === -1 || idx === lines.length - 1) addLine();
  else lines[idx + 1]._mq.focus();
}
function moveVert(mq, dir) {
  const lines = allLines();
  const idx = lines.indexOf(activeLine);
  const t = idx + dir;
  if (idx !== -1 && t >= 0 && t < lines.length) lines[t]._mq.focus();
  else if (dir > 0) addLine();
}
function backspaceEmpty(mq) {
  const lines = allLines();
  if (lines.length <= 1) return;
  const idx = lines.indexOf(activeLine);
  if (idx !== -1 && mq.latex().trim() === '') deleteLine(lines[idx]);
}

/* ============================================================
   Virtual keyboard actions
============================================================ */
const K = {
  ensure() { if (!activeMQ) { const f = document.querySelector('.mq-field'); if (f) activeMQ = f.__mq; } return activeMQ; },
  type(t)  { const mq = this.ensure(); if (mq) { mq.typedText(t); mq.focus(); scheduleEval(); } },
  cmd(c)   { const mq = this.ensure(); if (mq) { mq.cmd(c); mq.focus(); scheduleEval(); } },
  write(l) { const mq = this.ensure(); if (mq) { mq.write(l); mq.focus(); scheduleEval(); } },
  // Like write(), but for templates ending in an empty "\left(\right)" operand
  // (Derivative, Integral, Summation, Limit) — mq.write() leaves the cursor
  // AFTER the whole inserted template, not inside the placeholder parens, so
  // typing the operand right away (e.g. a fraction) would wrap the entire
  // template into the new fraction's numerator. `leftSteps` walks the cursor
  // back inside the parens: 1 for templates ending right at "\right)", 3 for
  // ones with a trailing "dx" after it.
  writeTemplate(l, leftSteps) {
    const mq = this.ensure();
    if (mq) { mq.write(l); for (let i = 0; i < leftSteps; i++) mq.keystroke('Left'); mq.focus(); scheduleEval(); }
  },
  backspace(){ const mq = this.ensure(); if (mq) { mq.keystroke('Backspace'); mq.focus(); scheduleEval(); } },
  pow2()   { const mq = this.ensure(); if (mq) { mq.cmd('^'); mq.typedText('2'); mq.keystroke('Right'); mq.focus(); scheduleEval(); } },
  fn(name) { this.type(name + '('); },
  log10()  { this.type('log('); },                 // base-10 log (default)
  logBase(){ const mq = this.ensure(); if (mq) { mq.typedText('log'); mq.cmd('_'); mq.focus(); scheduleEval(); } },
  abs()    { const mq = this.ensure(); if (mq) { mq.cmd('|'); mq.focus(); scheduleEval(); } },
  nthroot(){ const mq = this.ensure(); if (mq) { mq.cmd('\\nthroot'); mq.focus(); scheduleEval(); } },
  left()   { const mq = this.ensure(); if (mq) { mq.keystroke('Left'); mq.focus(); } },
  right()  { const mq = this.ensure(); if (mq) { mq.keystroke('Right'); mq.focus(); } },
  enter()  { const mq = this.ensure(); if (mq) { mq.typedText('\n'); } },
};

/* ============================================================
   Function palette
============================================================ */
const PALETTE = {
  'Calculus': [
    { sym: 'd/dx', name: 'Derivative', act: () => K.writeTemplate('\\frac{d}{dx}\\left(\\right)', 1) },
    { sym: '∫ dx', name: 'Integral',   act: () => K.writeTemplate('\\int\\left(\\right)dx', 3) },
    { sym: '∫ᵇₐ',  name: 'Definite integral', act: () => K.writeTemplate('\\int_{0}^{1}\\left(\\right)dx', 3) },
    { sym: 'Σ',    name: 'Summation',  act: () => K.writeTemplate('\\sum_{n=1}^{10}\\left(\\right)', 1) },
    { sym: 'lim',  name: 'Limit',      act: () => K.writeTemplate('\\lim_{x\\to0}\\left(\\right)', 1) },
  ],
  'Algebra': [
    { sym: 'factor',   name: 'Factor',   act: () => K.type('factor(') },
    { sym: 'expand',   name: 'Expand',   act: () => K.type('expand(') },
    { sym: 'simplify', name: 'Simplify', act: () => K.type('simplify(') },
    { sym: 'gcd',      name: 'GCD',      act: () => K.type('gcd(') },
    { sym: 'lcm',      name: 'LCM',      act: () => K.type('lcm(') },
    { sym: 'mod',      name: 'Modulo',   act: () => K.type('mod(') },
  ],
  'Trigonometry': [
    { sym: 'sin', name: 'sine', act: () => K.fn('sin') },
    { sym: 'cos', name: 'cosine', act: () => K.fn('cos') },
    { sym: 'tan', name: 'tangent', act: () => K.fn('tan') },
    { sym: 'sin⁻¹', name: 'arcsin', act: () => K.fn('arcsin') },
    { sym: 'cos⁻¹', name: 'arccos', act: () => K.fn('arccos') },
    { sym: 'tan⁻¹', name: 'arctan', act: () => K.fn('arctan') },
    { sym: 'sinh', name: 'hyperbolic sine', act: () => K.fn('sinh') },
    { sym: 'cosh', name: 'hyperbolic cosine', act: () => K.fn('cosh') },
    { sym: 'tanh', name: 'hyperbolic tangent', act: () => K.fn('tanh') },
  ],
  'Greek letters': [
    { sym: 'π', name: 'pi', act: () => K.cmd('\\pi') },
    { sym: 'θ', name: 'theta', act: () => K.cmd('\\theta') },
    { sym: 'α', name: 'alpha', act: () => K.cmd('\\alpha') },
    { sym: 'β', name: 'beta', act: () => K.cmd('\\beta') },
    { sym: 'γ', name: 'gamma', act: () => K.cmd('\\gamma') },
    { sym: 'δ', name: 'delta', act: () => K.cmd('\\delta') },
    { sym: 'λ', name: 'lambda', act: () => K.cmd('\\lambda') },
    { sym: 'μ', name: 'mu', act: () => K.cmd('\\mu') },
    { sym: 'σ', name: 'sigma', act: () => K.cmd('\\sigma') },
    { sym: 'ω', name: 'omega', act: () => K.cmd('\\omega') },
  ],
  'Constants': [
    { sym: 'π', name: 'pi ≈ 3.14159', act: () => K.type('pi') },
    { sym: 'e', name: 'Euler ≈ 2.71828', act: () => K.type('e') },
    { sym: '∞', name: 'infinity', act: () => K.cmd('\\infty') },
    { sym: 'i', name: 'imaginary unit', act: () => K.type('i') },
  ],
};

function buildPalette() {
  const body = document.getElementById('paletteBody');
  body.innerHTML = '';
  for (const [cat, items] of Object.entries(PALETTE)) {
    const wrap = document.createElement('div');
    wrap.className = 'pal-cat';
    wrap.innerHTML = `<h3>${cat}</h3>`;
    const grid = document.createElement('div');
    grid.className = 'pal-grid';
    items.forEach((it, idx) => {
      const el = document.createElement('div');
      el.className = 'pal-item';
      el.innerHTML = `<span class="pal-sym">${it.sym}</span><span class="pal-name">${it.name}</span>`;
      el.onclick = () => { it.act(); closePalette(); };
      grid.appendChild(el);
    });
    wrap.appendChild(grid);
    body.appendChild(wrap);
  }
}
function openPalette()  { document.getElementById('palette').classList.add('show'); }
function closePalette() { document.getElementById('palette').classList.remove('show'); if (activeMQ) activeMQ.focus(); }

/* ============================================================
   Evaluation
============================================================ */
let evalTimer = null;
function scheduleEval() { clearTimeout(evalTimer); evalTimer = setTimeout(evaluateAll, 90); }

function setComplex(on) {
  complexMode = on;
  document.getElementById('modeReal').classList.toggle('active', !on);
  document.getElementById('modeComplex').classList.toggle('active', on);
  document.getElementById('modeLabel').textContent = on ? 'Complex' : 'Real';
  evaluateAll();
}

function setDecimal(on) {
  decimalMode = on;
  document.getElementById('modeExact').classList.toggle('active', !on);
  document.getElementById('modeDecimal').classList.toggle('active', on);
  evaluateAll();
}

function evaluateAll() {
  try { nerdamer.clearVars(); } catch {}
  numScope = {}; varNames = new Set(); knownVars = new Map(); primaryDefLine = new Map(); primaryFuncDefLine = new Map();

  const linesArr = allLines();

  // Find "f(x) = ..." definitions from the RAW latex (before latexToExpr, which
  // itself needs to know these names to tell a function call apart from
  // implicit multiplication — chicken-and-egg, so this scan can't go through
  // the normal parser).
  knownFunctionNames = new Set();
  linesArr.forEach(line => {
    const mq = line._mq;
    const latex = mq ? mq.latex() : '';
    const stripped = latex ? latex.replace(/\\left/g, '').replace(/\\right/g, '') : '';
    const m = stripped.match(/^([a-zA-Z])\(([a-zA-Z])\)\s*=(?!=)/);
    if (m) knownFunctionNames.add(m[1]);
  });

  // Same "first line owns it" rule as plain variables (below): a later
  // "f(x) = 9" isn't a redefinition of f, it's an equation to solve for x
  // using the already-known f — see evalExpr's fdef handling.
  linesArr.forEach(line => {
    const mq = line._mq;
    const latex = mq ? mq.latex() : '';
    const stripped = latex ? latex.replace(/\\left/g, '').replace(/\\right/g, '') : '';
    const m = stripped.match(/^([a-zA-Z])\(([a-zA-Z])\)\s*=(?!=)/);
    if (m && !primaryFuncDefLine.has(m[1])) primaryFuncDefLine.set(m[1], line);
  });

  const systemResults = solveSystems(linesArr);
  // a=b+1, b=a+1 would otherwise make nerdamer's own variable table
  // self-referential and hang the whole page trying to resolve it — catch that
  // before it ever reaches nerdamer.setVar.
  const circular = detectCircularAssignments(linesArr);

  // First simple "name = ..." line for each name "owns" plain assignment to it;
  // any later line reusing that name is treated as an equation using the known
  // value instead of a silent redefinition (see evalExpr).
  linesArr.forEach(line => {
    const mq = line._mq;
    const latex = mq ? mq.latex() : '';
    if (!latex || !latex.trim()) return;
    let expr;
    try { expr = latexToExpr(latex, complexMode); } catch { return; }
    const m = expr.match(/^([a-zA-Z]\w*)\s*=(?!=)\s*(.+)$/);
    if (m && !/[+\-*/^]/.test(m[1]) && !primaryDefLine.has(m[1])) primaryDefLine.set(m[1], line);
  });

  // Run multiple passes so forward references resolve — e.g. line 3 using a
  // variable defined on line 5 — like a spreadsheet, not strictly top-to-bottom.
  // numScope/knownVars persist and accumulate across passes (not reset per pass),
  // so once a later line's value becomes known, an earlier line that referenced
  // it picks it up on the next pass. Cheap to just always run a few passes given
  // how few lines a calculator like this typically has.
  const PASSES = 5;
  for (let pass = 0; pass < PASSES; pass++) {
    linesArr.forEach(line => {
      const mq = line._mq;
      const latex = mq ? mq.latex() : '';
      const arrow = line.querySelector('.larrow');
      const result = line.querySelector('.lresult');

      line.classList.remove('is-error', 'is-result');
      arrow.textContent = '';
      result.textContent = '';
      result.className = 'lresult';

      if (!latex || !latex.trim()) return;

      if (circular.has(line)) {
        arrow.textContent = '→';
        result.textContent = 'Circular reference — this depends on itself through other lines.';
        result.classList.add('err');
        line.classList.add('is-error');
        return;
      }

      try {
        const out = systemResults.get(line) || evalLatex(latex, line);
        if (out && out.text != null) {
          arrow.textContent = '→';
          if (out.cls) result.classList.add(out.cls);
          line.classList.add(out.cls === 'err' ? 'is-error' : 'is-result');
          renderResult(result, out);
        }
      } catch (err) {
        arrow.textContent = '→';
        result.textContent = niceError(err.message);
        result.classList.add('err');
        line.classList.add('is-error');
      }
    });
  }

  renderVarsPanel();
}

/* Find simple assignment lines (name = expr) whose dependencies form a cycle
   (a depends on b, b depends on a, etc.) — returns the set of involved <div class="line"> elements. */
function detectCircularAssignments(linesArr) {
  const assignInfo = new Map();   // varName -> { line, deps: Set<varName> }
  for (const line of linesArr) {
    const mq = line._mq;
    const latex = mq ? mq.latex() : '';
    if (!latex || !latex.trim()) continue;
    if (/\\frac\{d\}\{d/.test(latex) || /\\int/.test(latex) || /\\sum/.test(latex) || /\\lim/.test(latex)) continue;
    let expr;
    try { expr = latexToExpr(latex, complexMode); } catch { continue; }
    const m = expr.match(/^([a-zA-Z]\w*)\s*=(?!=)\s*(.+)$/);
    if (!m || /[+\-*/^]/.test(m[1])) continue;   // not a simple "name = ..." assignment
    const name = m[1];
    // Scan only the right-hand side — scanning the whole "name=expr" string would
    // always "find" the LHS name itself and falsely flag every assignment as self-referential.
    const deps = new Set(findUnknowns(m[2]));
    assignInfo.set(name, { line, deps });
  }

  const circularLines = new Set();
  const state = new Map();   // varName -> 0 unvisited, 1 in-progress, 2 done
  function dfs(name) {
    if (!assignInfo.has(name)) return false;
    const st = state.get(name);
    if (st === 1) return true;    // back-edge to something still on the stack → cycle
    if (st === 2) return false;
    state.set(name, 1);
    let cyc = false;
    for (const d of assignInfo.get(name).deps) if (dfs(d)) cyc = true;
    state.set(name, 2);
    if (cyc) circularLines.add(assignInfo.get(name).line);
    return cyc;
  }
  for (const name of assignInfo.keys()) dfs(name);
  return circularLines;
}

/* Store a solved/assigned value so other lines (and the sidebar) can use it */
function registerKnownValue(name, valueExprStr) {
  try {
    const val = math.evaluate(valueExprStr, numScope);
    if (typeof val === 'number' && isFinite(val)) {
      numScope[name] = val;
      // Exact mode: the sidebar should show the exact form (∛2, √3, …) when
      // the solved value has one, not the decimal — numScope still gets the
      // number so other lines can keep computing with it. tryExactForm's own
      // digit-run guard keeps purely-numeric roots (Newton, trig) decimal.
      const exact = decimalMode ? null : tryExactForm(valueExprStr, val);
      try { nerdamer.setVar(name, exact ? exact.raw : String(val)); } catch {}
      varNames.add(name);
      knownVars.set(name, exact ? { text: exact.text, tex: exact.tex } : { text: fmtNum(val), tex: fmtNumTeX(val) });
      return;
    }
    if (val && val.isComplex) {
      numScope[name] = val;
      try { nerdamer.setVar(name, valueExprStr); } catch {}
      varNames.add(name);
      const exact = decimalMode ? null : tryExactForm(valueExprStr, val);
      knownVars.set(name, exact ? { text: exact.text, tex: exact.tex } : { text: fmtMath(val), tex: complexTeX(val) });
      return;
    }
  } catch {}
  try {
    nerdamer.setVar(name, valueExprStr);
    varNames.add(name);
    knownVars.set(name, { text: disp(valueExprStr), tex: safeTeXStr(valueExprStr) });
  } catch {}
}

/* A variable with several candidate values (ambiguous equation/system) can't be
   substituted into other lines, but should still show up in the sidebar.
   `items` is an array of {text, tex} pairs, same shape as a single entry. */
function registerMultiValue(name, items) {
  knownVars.set(name, { multi: items });
}

/* Render the "Variables" sidebar from whatever's been solved/assigned so far.
   Values are rendered through KaTeX (falling back to plain text if a value
   has no `tex` or KaTeX can't parse it) so they look like normal math
   symbols instead of raw notation like "sqrt(3)" or "x^2". */
function renderVarsPanel() {
  const list = document.getElementById('varsList');
  if (!list) return;
  const names = [...knownVars.keys()].sort((a, b) => disp(a).localeCompare(disp(b)));

  if (!names.length) { list.innerHTML = '<div class="vars-empty">No variables yet</div>'; return; }

  list.innerHTML = '';
  names.forEach(n => {
    const info = knownVars.get(n);
    const row = document.createElement('div');
    row.className = 'var-item';
    const nameEl = document.createElement('span');
    nameEl.className = 'var-name';
    const shown = info.label || disp(n);
    // Greek names come through as words ("theta") — render the actual letter
    if (GREEK_NAMES.has(shown)) {
      try { nameEl.innerHTML = katex.renderToString('\\' + shown, { throwOnError: false }); }
      catch { nameEl.textContent = shown; }
    } else nameEl.textContent = shown;
    const valEl = document.createElement('span');
    valEl.className = 'var-val';
    const items = info.multi || [info];
    items.forEach((item, i) => {
      if (i > 0) valEl.appendChild(document.createTextNode('  or  '));
      valEl.appendChild(katexOrTextSpan(item));
    });
    row.append(nameEl, valEl);
    list.appendChild(row);
  });
}

function katexOrTextSpan(item) {
  const span = document.createElement('span');
  if (item.tex) {
    try { span.innerHTML = katex.renderToString(item.tex, { throwOnError: false }); return span; }
    catch {}
  }
  span.textContent = item.text;
  return span;
}

function renderResult(el, out) {
  if (out.parts && out.parts.length) {
    el.innerHTML = '';
    out.parts.forEach((p, i) => {
      if (i > 0) {
        const sep = document.createElement('div');
        sep.className = 'lresult-or';
        sep.textContent = 'or';
        el.appendChild(sep);
      }
      const row = document.createElement('div');
      try { row.innerHTML = katex.renderToString(p, { throwOnError: false }); }
      catch { row.textContent = p; }
      el.appendChild(row);
    });
    return;
  }
  if (out.tex && out.cls !== 'err') {
    try { el.innerHTML = katex.renderToString(out.tex, { throwOnError: false }); return; }
    catch {}
  }
  el.textContent = out.text;
}

/* Keep nerdamer in exact-symbolic mode (some ops flip PARSE2NUMBER on) */
function nerdExact() { try { nerdamer.getCore().Settings.PARSE2NUMBER = false; } catch {} }

/* If `name` was registered as a known value on an earlier evaluation pass,
   nerdamer.setVar left it in nerdamer's own symbol table — so nerdamer.coeffs()/
   .solve() would silently substitute that stale value instead of treating `name`
   as the unknown we're trying to solve for. Clear it right before solving for it. */
function freeVar(name) { try { nerdamer.setVar(name, 'delete'); } catch {} }

/* ── Route a line by its LaTeX ── */
function evalLatex(latex, line) {
  nerdExact();
  // High-level notation detection (before generic conversion)
  if (/\\frac\{d\}\{d/.test(latex))  return evalDerivative(latex);
  if (/\\int/.test(latex))           return evalIntegral(latex);
  if (/\\sum/.test(latex))           return evalSum(latex);
  if (/\\lim/.test(latex))           return evalLimit(latex);

  const expr = latexToExpr(latex, complexMode);
  if (!expr.trim()) return null;
  return evalExpr(expr, line);
}

/* ── Evaluate a converted expression ── */
function evalExpr(expr, line) {
  // Symbolic word-commands: factor(...), expand(...), simplify(...)
  const cmd = expr.match(/^(factor|expand|simplify)\((.*)\)$/s);
  if (cmd) return symbolicCmd(cmd[1], cmd[2]);

  // Trailing "=" with nothing after it (e.g. "7*8=") → just show the answer,
  // like pressing "=" on a calculator, instead of comparing against an empty right side.
  const trimmed = expr.trim();
  if (trimmed.endsWith('=') && !trimmed.endsWith('==')) return plainExpr(trimmed.slice(0, -1));

  // Function definition:  f(x) = <formula>
  const fdef = expr.match(/^([a-zA-Z])\(([a-zA-Z]\w*)\)\s*=(?!=)\s*(.+)$/);
  if (fdef) {
    // Same "first line owns it" rule as plain variable reassignment: a later
    // "f(x) = 9" (from a different line than the one that defined f) is an
    // equation to solve for x using the already-known f, not a redefinition.
    const owner = primaryFuncDefLine.get(fdef[1]);
    if (owner && owner !== line && Object.prototype.hasOwnProperty.call(numScope, fdef[1])) {
      let substituted = null;
      try { substituted = nerdamer(`${fdef[1]}(${fdef[2]})`).toString(); } catch {}
      if (substituted) return solveEquation(`(${substituted})=(${fdef[3]})`);
    }
    return defineFunction(fdef[1], fdef[2], fdef[3]);
  }

  // Assignment:  <name> = <value>
  const asgn = expr.match(/^([a-zA-Z]\w*)\s*=(?!=)\s*(.+)$/);
  if (asgn && !/[+\-*/^]/.test(asgn[1])) {
    // If some OTHER, earlier line already owns this name (e.g. "x=5" on line 1),
    // a later "x=y+1" isn't a redefinition — it's an equation relating the known
    // x to y, solvable for y. But the owning line itself must keep reassigning
    // normally on every pass, or multi-pass evaluation would see its own
    // previously-set value and mistake itself for a "later reuse".
    const owner = primaryDefLine.get(asgn[1]);
    if (owner && owner !== line && Object.prototype.hasOwnProperty.call(numScope, asgn[1]))
      return solveEquation(`(${numScope[asgn[1]]})=(${asgn[2]})`);
    return assign(asgn[1], asgn[2]);
  }

  // Equation
  if (/(?<![=!<>])=(?!=)/.test(expr)) return solveEquation(expr);

  // Plain expression
  return plainExpr(expr);
}

const RESERVED_CONSTANTS = new Set(['pi', 'e', 'tau', 'phi', 'i', 'Infinity', 'NaN']);
function assign(name, rhs) {
  if (RESERVED_CONSTANTS.has(name))
    return { text: `"${disp(name)}" is a reserved constant — pick a different variable name.`, cls: 'err' };
  try {
    const val = math.evaluate(rhs, numScope);
    if (typeof val === 'number' && isFinite(val)) {
      numScope[name] = val; varNames.add(name);
      // Exact mode: "y = sqrt(3)" should show (and remember, in the sidebar
      // and in nerdamer's symbol table) √3, not 1.732… — same helper and
      // reasoning as plainExpr. numScope still gets the numeric value so
      // other lines can compute with it either way.
      const exact = decimalMode ? null : tryExactForm(rhs, val);
      try { nerdamer.setVar(name, exact ? exact.raw : String(val)); } catch {}
      if (exact) { knownVars.set(name, { text: exact.text, tex: exact.tex }); return exact; }
      knownVars.set(name, { text: fmtNum(val), tex: fmtNumTeX(val) });
      return { tex: fmtNumTeX(val), text: fmtNum(val), cls: 'num' };
    }
    if (val && val.isComplex) {
      if (!complexMode && Math.abs(val.im) > 1e-12)
        return { text: 'This needs an imaginary number — turn on ℂ Complex mode (top right) to see it.', cls: 'err' };
      numScope[name] = val; varNames.add(name);
      const exact = decimalMode ? null : tryExactForm(rhs, val);
      if (exact) { knownVars.set(name, { text: exact.text, tex: exact.tex }); return exact; }
      knownVars.set(name, { text: fmtMath(val), tex: complexTeX(val) });
      return { tex: complexTeX(val), text: fmtMath(val), cls: 'num' };
    }
    numScope[name] = val; varNames.add(name);
    knownVars.set(name, { text: fmtMath(val) });
    return { text: fmtMath(val), cls: null };
  } catch {}
  try {
    const s = nerdamer(rhs); const str = s.toString();
    try { nerdamer.setVar(name, str); } catch {}
    varNames.add(name);
    // Decimal mode: fold the numeric part of a symbolic value the same way
    // plainExpr does — "y = sqrt(3)*x" should show 1.732050808·x.
    if (decimalMode) {
      const dec = tryDecimalCoeffForm(rhs);
      if (dec) { knownVars.set(name, { text: dec.text, tex: dec.tex }); return dec; }
    }
    knownVars.set(name, { text: disp(str), tex: safeTeX(s) });
    return { tex: safeTeX(s), text: disp(str), cls: 'sym' };
  } catch { throw new Error('Cannot evaluate'); }
}

function defineFunction(name, param, rhs) {
  if (RESERVED_CONSTANTS.has(name))
    return { text: `"${disp(name)}" is a reserved constant — pick a different function name.`, cls: 'err' };
  try { math.evaluate(`${name}(${param}) = ${rhs}`, numScope); }
  catch { return { text: `Couldn't make sense of that formula for ${disp(name)}(${disp(param)}).`, cls: 'err' }; }
  try { nerdamer.setFunction(name, [param], rhs); } catch {}
  // Decimal mode should apply to a function's formula too, e.g.
  // "f(x) = sqrt(3)*x" -> "f(x) = 1.732050808*x" — same fold-the-constants
  // helper plainExpr uses for the same reason.
  let rhsText = disp(rhs), rhsTex = safeTeXStr(rhs);
  if (decimalMode) { const dec = tryDecimalCoeffForm(rhs); if (dec) { rhsText = dec.text; rhsTex = dec.tex; } }
  knownVars.set(name, { text: rhsText, tex: rhsTex, label: `${disp(name)}(${disp(param)})` });
  return { tex: `${disp(name)}(${disp(param)}) = ${rhsTex}`, text: `${disp(name)}(${disp(param)}) = ${rhsText}`, cls: 'sym' };
}

function solveEquation(expr) {
  const eq = expr.match(/(?<![=!<>])=(?!=)/);
  const lhs = expr.slice(0, eq.index).trim();
  const rhs = expr.slice(eq.index + 1).trim();
  const unknowns = findUnknowns(expr);

  if (unknowns.length === 0) {
    try {
      const l = math.evaluate(lhs, numScope), r = math.evaluate(rhs, numScope);
      const same = (typeof l === 'number' && typeof r === 'number')
        ? Math.abs(l - r) < 1e-9 : String(l) === String(r);
      return { text: same ? '✓  True' : '✗  False', cls: same ? 'ok' : null };
    } catch { return { text: 'Couldn’t check whether this is true — check your typing.', cls: 'err' }; }
  }
  if (unknowns.length > 1)
    return { text: `This has more than one unknown (${unknowns.map(disp).join(', ')}). Add another equation using the same variable(s) on another line and I’ll try to solve them together.`, cls: 'err' };

  const v = unknowns[0], dv = disp(v);

  // A malformed side (e.g. "x^2 = 3-", a dangling operator) can't be evaluated
  // at ANY x, so every downstream solver — numeric search included — just
  // sees "NaN everywhere" and reports "no solution found", which reads like
  // the equation was fine but unsolvable rather than the truth: it's not
  // valid math. Catch that up front with one substitution-based test eval.
  try { math.evaluate(lhs, { ...numScope, [v]: 1 }); math.evaluate(rhs, { ...numScope, [v]: 1 }); }
  catch (e) {
    if (/unexpected|syntax/i.test(e.message || ''))
      return { text: 'That doesn’t look like valid math — check for a missing number or a trailing +, -, *, or /.', cls: 'err' };
  }

  const poly = `(${lhs})-(${rhs})`;

  const coeffs = polyCoeffs(poly, v);
  if (!coeffs) {
    const abs = tryAbsImpossible(lhs, rhs);              // |...| = negative → no solution at all, ever
    if (abs) return abs;
    const trig = trySimpleTrigInverse(lhs, rhs, v);      // sin(y)=1 → one principal answer, not many
    if (trig) return trig;
    return numericSolve(lhs, rhs, v);                    // non-polynomial → numeric
  }

  let parts;
  const deg = coeffs.length - 1;
  // The unknown cancelled out entirely. A leftover nonzero constant (x = x+1 →
  // -1) means no value ever works; a leftover ZERO (x+1 = x+1) means every
  // value works — which is the opposite of "no solution".
  if (deg < 1) return Math.abs(coeffs[0] || 0) < 1e-9
    ? { text: `✓  True for every value of ${dv}`, cls: 'ok' }
    : { text: 'This equation has no solution.', cls: null };
  parts = polyRootParts(coeffs, poly, v);

  if (!complexMode) parts = parts.filter(p => p.real);
  if (!parts.length) return { text: complexMode ? 'This equation has no solution.' : 'No real number solves this — try ℂ Complex mode to see a complex answer.', cls: null };
  if (parts.length === 1) { registerKnownValue(v, parts[0].text); return { text: null }; }
  registerMultiValue(v, parts.map(p => ({ text: p.text, tex: p.tex })));
  return formatSolutions(parts, v);
}

function formatSolutions(parts, v) {
  return {
    parts: parts.map(p => `${dispTeX(v)} = ${p.tex}`),
    text: parts.map(p => `${disp(v)} = ${p.text}`).join('   or   '),
    cls: 'num',
  };
}

/* ============================================================
   Systems of equations (multiple lines, multiple unknowns)
   Groups equation-lines that share variables and, if the group is
   "square" (as many equations as unknowns), tries to solve them together:
   linear systems via nerdamer.solveEquations; otherwise substitution for
   the common 2-equation/2-unknown case (e.g. x+y=5, xy=24).
============================================================ */
function solveSystems(linesArr) {
  const results = new Map();

  const info = linesArr.map(line => {
    const mq = line._mq;
    const latex = mq ? mq.latex() : '';
    if (!latex || !latex.trim()) return null;
    if (/\\frac\{d\}\{d/.test(latex) || /\\int/.test(latex) || /\\sum/.test(latex) || /\\lim/.test(latex)) return null;
    let expr;
    try { nerdExact(); expr = latexToExpr(latex, complexMode); } catch { return null; }
    if (!expr || !expr.trim()) return null;
    const eqMatch = expr.match(/(?<![=!<>])=(?!=)/);
    if (!eqMatch) return null;
    const lhs = expr.slice(0, eqMatch.index).trim();
    const rhs = expr.slice(eqMatch.index + 1).trim();
    const asgn = expr.match(/^([a-zA-Z]\w*)\s*=(?!=)\s*(.+)$/);
    if (asgn && !/[+\-*/^]/.test(asgn[1])) return null;   // plain assignment, not a system equation
    const unknowns = findUnknowns(expr);
    if (unknowns.length < 2) return null;                 // single-unknown handled by the normal solver
    return { line, lhs, rhs, unknowns };
  });

  const idxList = info.map((e, i) => (e ? i : -1)).filter(i => i >= 0);
  const visited = new Set();

  for (const i of idxList) {
    if (visited.has(i)) continue;
    const comp = [i]; visited.add(i);
    let frontier = [i];
    while (frontier.length) {
      const next = [];
      for (const a of frontier) {
        for (const b of idxList) {
          if (visited.has(b)) continue;
          if (info[a].unknowns.some(v => info[b].unknowns.includes(v))) { visited.add(b); comp.push(b); next.push(b); }
        }
      }
      frontier = next;
    }
    if (comp.length < 2) continue;   // no partner equation → leave the normal per-line message

    const allVars = [...new Set(comp.flatMap(c => info[c].unknowns))];
    if (allVars.length !== comp.length) continue;   // not a square system → can't uniquely solve

    const eqs = comp.map(c => `(${info[c].lhs})-(${info[c].rhs})`);
    const solved = trySolveSystem(eqs, allVars);
    if (solved === null) {
      // A genuinely square system (right number of equations), just beyond what the
      // solver supports (3+ variable nonlinear systems aren't attempted) — say so
      // plainly instead of the generic "add another equation" message, which would
      // wrongly imply the user is missing an equation when they already gave enough.
      const out = { text: `This is a system of ${comp.length} equations and ${comp.length} unknowns, but it's too complex for me to solve automatically — I can only handle linear systems of any size, or 2-variable nonlinear systems like x+y=5, xy=24.`, cls: 'err' };
      for (const c of comp) results.set(info[c].line, out);
      continue;
    }

    if (!solved.length) {
      const out = { text: 'This system has no solution — these equations contradict each other.', cls: null };
      for (const c of comp) results.set(info[c].line, out);
      continue;
    }

    const tuples = cleanSystemSolutions(solved, allVars);
    let out;
    if (tuples.length === 1) {
      tuples[0].forEach(p => registerKnownValue(p.v, p.text));
      out = { text: null };
    } else {
      if (tuples.length > 1) {
        for (const v of allVars) registerMultiValue(v, tuples.map(t => { const p = t.find(p => p.v === v); return { text: p.text, tex: p.tex }; }));
      }
      out = formatSystemDisplay(tuples);
    }
    for (const c of comp) results.set(info[c].line, out);
  }

  return results;
}

function trySolveSystem(eqs, vars) {
  // Linear systems (any size) → nerdamer's own solver
  try {
    const r = nerdamer.solveEquations(eqs, vars);
    if (Array.isArray(r) && r.length === vars.length && r.every(p => Array.isArray(p) && p.length === 2)) {
      const sol = {};
      for (const [v, val] of r) sol[v] = String(val);
      if (vars.every(v => sol[v] !== undefined)) return [sol];
    }
  } catch {}

  // Nonlinear fallback via substitution — currently 2 equations / 2 unknowns
  if (vars.length === 2 && eqs.length === 2) return solveSystem2x2(eqs, vars);
  return null;
}

/* Returns: an array of solutions (may be empty [] to mean "definitely no
   solution — these equations contradict each other"), or null to mean
   "couldn't even attempt this" (caller should fall back to the per-line message). */
function solveSystem2x2(eqs, vars) {
  const [v1, v2] = vars;
  const [e1, e2] = eqs;
  const attempts = [[e1, e2, v1, v2], [e1, e2, v2, v1], [e2, e1, v1, v2], [e2, e1, v2, v1]];
  let sawContradiction = false;
  let best = [];

  for (const [solveEq, subEq, solveVar, otherVar] of attempts) {
    let subs;
    freeVar(solveVar); freeVar(otherVar);
    try { subs = splitList(nerdamer.solve(solveEq, solveVar).toString()); } catch { continue; }
    nerdExact();
    if (!subs.length || subs.length > 2) continue;

    const results = [];
    for (const sExpr of subs) {
      try {
        const substituted = nerdamer(subEq).sub(solveVar, `(${sExpr})`).toString();
        const expanded = nerdamer.expand(substituted).toString();
        const coeffs = polyCoeffs(expanded, otherVar);
        let otherRoots;
        if (coeffs) {
          const deg = coeffs.length - 1;
          if (deg < 1) {
            // the variable cancelled out entirely: a nonzero constant means these
            // two equations contradict each other, so there's no solution at all
            if (Math.abs(coeffs[0] || 0) > 1e-9) sawContradiction = true;
            continue;
          }
          // Same verified pipeline as single equations — nerdamer's raw
          // cubic+ complex roots can't be trusted (see polyRootParts).
          otherRoots = polyRootParts(coeffs, expanded, otherVar).map(r => r.plain || r.text);
        } else {
          otherRoots = numericRoots(expanded, otherVar);
        }
        for (const ov of otherRoots) {
          const solvedValStr = nerdamer(sExpr).sub(otherVar, `(${ov})`).toString();
          const sol = {}; sol[solveVar] = solvedValStr; sol[otherVar] = ov;
          results.push(sol);
        }
      } catch {}
    }
    // Don't stop at the first ordering that yields anything — another
    // ordering may produce a polynomial substitution that finds the full
    // solution set (e.g. x²=y, xy=-8: solving for x first finds only the
    // real pair via Newton, solving for y first finds all three exactly).
    if (results.length > best.length) best = results;
  }
  return best.length ? best : (sawContradiction ? [] : null);
}

/* Real-valued roots of a single-variable expression set to zero (Newton fallback) */
function numericRoots(expr, v) {
  const f = x => { try { return math.evaluate(disp(expr), { ...numScope, [v]: x }); } catch { return NaN; } };
  return findRealRoots(f).slice(0, 6).map(String);
}

/* Simplify + dedupe raw solved tuples, filtered to real values in Real mode */
function cleanSystemSolutions(solved, vars) {
  const cleaned = solved
    .map(sol => vars.map(v => ({ v, ...rootFromExpr(sol[v]) })))
    .filter(parts => complexMode || parts.every(p => p.real));

  const seen = new Set(), deduped = [];
  for (const parts of cleaned) {
    const key = parts.map(p => p.text).join('|');
    if (!seen.has(key)) { seen.add(key); deduped.push(parts); }
  }
  return deduped;
}

function formatSystemDisplay(deduped) {
  if (!deduped.length)
    return { text: complexMode ? 'This system has no solution.' : 'No real solution — try ℂ Complex mode to see a complex answer.', cls: null };

  return {
    parts: deduped.map(parts => parts.map(p => `${dispTeX(p.v)} = ${p.tex}`).join(',\\ ')),
    text: deduped.map(parts => parts.map(p => `${disp(p.v)} = ${p.text}`).join(', ')).join('   or   '),
    cls: 'num',
  };
}

/* Extract numeric polynomial coefficients [c0, c1, …]; null if non-polynomial */
function polyCoeffs(poly, v) {
  let raw;
  freeVar(v);
  try { raw = splitList(nerdamer.coeffs(poly, v).toString()); } catch { return null; }
  if (!raw.length) return null;
  const c = [];
  for (const cr of raw) {
    let n;
    try { n = Number(math.evaluate(disp(cr), numScope)); } catch { return null; }
    if (!isFinite(n)) return null;
    c.push(Math.abs(n - Math.round(n)) < 1e-9 ? Math.round(n) : n);
  }
  while (c.length > 1 && Math.abs(c[c.length - 1]) < 1e-12) c.pop();
  return c;
}

/* Exact closed form for degree 1 or 2 */
function solveLowDegree(c) {
  if (c.length - 1 === 1) return [ rootFromExpr(`(${-c[0]})/(${c[1]})`) ];
  const a = c[2], b = c[1], cc = c[0];
  let disc = b * b - 4 * a * cc;
  if (Math.abs(disc - Math.round(disc)) < 1e-9) disc = Math.round(disc);
  if (Math.abs(disc) < 1e-12) return [ rootFromExpr(`(${-b})/(${2 * a})`) ];
  return [
    rootFromExpr(`(${-b}+sqrt(${disc}))/(${2 * a})`),
    rootFromExpr(`(${-b}-sqrt(${disc}))/(${2 * a})`),
  ];
}

function dedupe(parts) {
  const seen = new Set(), out = [];
  for (const p of parts) if (!seen.has(p.text)) { seen.add(p.text); out.push(p); }
  return out;
}

/* Format a math.js value (number or Complex) as a {text, tex, real} root
   display, snapping near-zero noise to exactly 0. Returns null if `val`
   isn't a usable finite number/complex (e.g. still has a free variable). */
function numericRootDisplay(val) {
  let re = val && val.isComplex ? val.re : (typeof val === 'number' ? val : NaN);
  let im = val && val.isComplex ? val.im : 0;
  if (!isFinite(re)) return null;
  if (Math.abs(re) < 1e-9) re = 0;
  if (Math.abs(im) < 1e-9) im = 0;
  if (im === 0) return { text: fmtNum(re), tex: fmtNumTeX(re), real: true };
  // `plain` is a machine-parseable ASCII form (the display text uses a
  // unicode minus and "2i" juxtaposition that nerdamer can't read back).
  return { text: fmtMath({ isComplex: true, re, im }), tex: complexTeX({ re, im }), real: false, plain: `(${re})+(${im})*i` };
}

/* Evaluate the polynomial c0 + c1·x + … at a complex point (Horner) */
function polyEvalC(cs, re, im) {
  let sre = 0, sim = 0;
  for (let k = cs.length - 1; k >= 0; k--) {
    const t = sre * re - sim * im + cs[k];
    sim = sre * im + sim * re; sre = t;
  }
  return { re: sre, im: sim };
}

/* Parse a root's display text back to a complex point ({re, im}), or null */
function rootZ(p) {
  let z;
  try { z = math.evaluate(String(p.text).replace(/−/g, '-'), {}); } catch { return null; }
  const re = z && z.isComplex ? z.re : Number(z), im = z && z.isComplex ? z.im : 0;
  return isFinite(re) && isFinite(im) ? { re, im } : null;
}

/* Plug a claimed root back into the polynomial and check the residual is
   ~zero. Guards against nerdamer.solve's wrong complex roots — see
   polyRootParts. */
function rootChecksOut(coeffs, p) {
  const z = rootZ(p);
  if (!z) return false;
  const f = polyEvalC(coeffs, z.re, z.im);
  const scale = Math.max(1, ...coeffs.map(Math.abs), Math.pow(Math.hypot(z.re, z.im), coeffs.length - 1));
  return Math.hypot(f.re, f.im) < 1e-6 * scale;
}

/* ALL complex roots of a numeric-coefficient polynomial (Durand–Kerner,
   then per-root Newton polish — plain DK leaves a multiple root smeared
   into a loose cluster of nearly-equal points; Newton's slow-but-sure
   linear convergence near a multiple root tightens each of them onto the
   true value so the cluster dedupes back into one root). */
function numericPolyRootsZ(coeffs) {
  const n = coeffs.length - 1;
  const c = coeffs.map(k => k / coeffs[n]);
  const dc = []; for (let k = 1; k <= n; k++) dc.push(c[k] * k);
  const zs = []; let re = 1, im = 0;
  for (let k = 0; k < n; k++) { const t = re * 0.4 - im * 0.9; im = re * 0.9 + im * 0.4; re = t; zs.push({ re, im }); }
  for (let iter = 0; iter < 600; iter++) {
    let moved = 0;
    for (let k = 0; k < n; k++) {
      const f = polyEvalC(c, zs[k].re, zs[k].im);
      let dre = 1, dim = 0;
      for (let j = 0; j < n; j++) {
        if (j === k) continue;
        const ar = zs[k].re - zs[j].re, ai = zs[k].im - zs[j].im;
        const t = dre * ar - dim * ai; dim = dre * ai + dim * ar; dre = t;
      }
      const den = dre * dre + dim * dim; if (den < 1e-300) continue;
      const qre = (f.re * dre + f.im * dim) / den, qim = (f.im * dre - f.re * dim) / den;
      zs[k] = { re: zs[k].re - qre, im: zs[k].im - qim };
      moved = Math.max(moved, Math.hypot(qre, qim));
    }
    if (moved < 1e-13) break;
  }
  for (const z of zs) {
    for (let iter = 0; iter < 120; iter++) {
      const f = polyEvalC(c, z.re, z.im), d = polyEvalC(dc, z.re, z.im);
      const den = d.re * d.re + d.im * d.im; if (den < 1e-300) break;
      const qre = (f.re * d.re + f.im * d.im) / den, qim = (f.im * d.re - f.re * d.im) / den;
      z.re -= qre; z.im -= qim;
      if (Math.hypot(qre, qim) < 1e-15 * Math.max(1, Math.hypot(z.re, z.im))) break;
    }
  }
  const uniq = [];
  for (const z of zs) {
    const zr = { re: Math.abs(z.re) < 1e-9 ? 0 : z.re, im: Math.abs(z.im) < 1e-9 ? 0 : z.im };
    if (Math.abs(zr.re - Math.round(zr.re)) < 1e-9) zr.re = Math.round(zr.re);
    if (Math.abs(zr.im - Math.round(zr.im)) < 1e-9) zr.im = Math.round(zr.im);
    if (!uniq.some(u => Math.hypot(u.re - zr.re, u.im - zr.im) < 1e-6)) uniq.push(zr);
  }
  uniq.sort((a, b) => (a.im === 0) === (b.im === 0) ? (a.re - b.re || a.im - b.im) : (a.im === 0 ? -1 : 1));
  return uniq;
}

/* Root parts for a numeric-coefficient polynomial (deg ≥ 1) in `v`:
   exact closed forms where clean (linear/quadratic/pure powers), else
   nerdamer verified root-by-root against the polynomial, topped up from the
   numeric root set for anything nerdamer missed or got wrong (x³=8 →
   -1±i/2, x⁴=1 → ±i/2 — nerdamer's cubic/quartic solver really does
   return those). A numeric candidate that lands next to an already-verified
   root is that same root (multiple roots come back from the numeric solver
   as a tight cluster), not a new one. */
function polyRootParts(coeffs, poly, v) {
  const deg = coeffs.length - 1;
  if (deg <= 2) return solveLowDegree(coeffs);
  let parts = null;
  if (Number.isInteger(coeffs[0]) && Number.isInteger(coeffs[deg])
      && coeffs.slice(1, -1).every(k => Math.abs(k) < 1e-12)) {
    // Pure "x^n = c": nerdamer loses the clean radical (x³=2 → 1.2599…
    // instead of ∛2). These roots have a direct exact form — build them.
    const c = -coeffs[0] / coeffs[deg];
    const base = `((${Math.abs(coeffs[0])})/(${Math.abs(coeffs[deg])}))^(1/${deg})`;
    if (c === 0) parts = [ rootFromExpr('0') ];
    else if (deg % 2 === 1) {
      parts = [ rootFromExpr(c > 0 ? base : `-${base}`) ];
      // Complex mode wants the non-real roots too. The cube-root pair is a
      // clean exact form; higher powers fall through to the numeric path.
      if (complexMode && deg === 3)
        parts.push(rootFromExpr(`(${parts[0].text})*((-1+sqrt(3)*i)/2)`), rootFromExpr(`(${parts[0].text})*((-1-sqrt(3)*i)/2)`));
      else if (complexMode) parts = null;
    } else if (c > 0) {
      parts = [ rootFromExpr(base), rootFromExpr(`-${base}`) ];
      if (complexMode && deg === 4) parts.push(rootFromExpr(`(${base})*i`), rootFromExpr(`-(${base})*i`));
      else if (complexMode) parts = null;
    }
    else parts = complexMode ? null : [];
  }
  if (parts != null) return parts;
  freeVar(v);
  let raw = null;
  try { raw = splitList(nerdamer.solve(poly, v).toString()); } catch {}
  nerdExact();   // nerdamer.solve can flip PARSE2NUMBER on internally
  parts = raw ? dedupe(raw.map(cleanSolution)) : [];
  parts = parts.filter(p => rootChecksOut(coeffs, p));
  const have = parts.map(rootZ).filter(Boolean);
  for (const z of numericPolyRootsZ(coeffs)) {
    if (have.some(h => Math.hypot(h.re - z.re, h.im - z.im) < 1e-4)) continue;
    have.push(z);
    parts.push(numericRootDisplay(z.im === 0 ? z.re : { isComplex: true, re: z.re, im: z.im }));
  }
  return parts;
}

/* Simplify an exact root expression via nerdamer → {text, tex, real} */
function rootFromExpr(expr) {
  let s;
  nerdExact();
  try { s = nerdamer(expr).simplify().toString(); } catch { s = expr; }
  nerdExact();   // .simplify() can flip PARSE2NUMBER on, poisoning the re-parses below
  // nerdamer's simplify() sometimes rationalizes an irrational imaginary part
  // (e.g. sqrt(-3)) into a giant ugly fraction — prefer the unsimplified exact form then.
  // Must re-parse `expr` fresh here: .simplify() mutates its receiver in place, so
  // reusing the earlier nerdamer(expr) reference would read back corrupted state
  // (e.g. sqrt(4e300)/2 simplifying in-place down to a bare "1").
  if (/\d{6,}/.test(s)) { try { s = nerdamer(expr).toString(); } catch {} }
  // Worse than an ugly fraction: simplify() can silently return an outright
  // WRONG value for some complex expressions — e.g. "(-1+sqrt(-3))/2" (a
  // genuine complex root, ≈ -0.5+0.866i) collapses to the bare string "0".
  // That has no long digit run to trip the check above, so verify the
  // simplified form still numerically matches the original before trusting it.
  try {
    const orig = math.evaluate(expr, numScope);
    const simp = math.evaluate(disp(s), numScope);
    const re = v => (v && v.isComplex ? v.re : v), im = v => (v && v.isComplex ? v.im : 0);
    if (Math.abs(re(orig) - re(simp)) > 1e-6 || Math.abs(im(orig) - im(simp)) > 1e-6) {
      s = nerdamer(expr).toString();
    }
    // simplify() leaves a parenthesized power alone — a system's back-substituted
    // value like (1+i*sqrt(3))^2 stays unexpanded. expand() is the right tool,
    // but (as with everything nerdamer) only trust it if the value checks out.
    if (/\)\s*\^\d/.test(s)) {
      try {
        // NOTE: must be the .expand() METHOD — the nerdamer.expand(str) static
        // form rationalizes radicals into giant fractions, the method doesn't.
        const ex = nerdamer(s).expand().toString();
        nerdExact();
        const exVal = math.evaluate(disp(ex), numScope);
        if (!/\d{6,}/.test(ex) && Math.abs(re(orig) - re(exVal)) < 1e-6 && Math.abs(im(orig) - im(exVal)) < 1e-6) s = ex;
      } catch { nerdExact(); }
    }
    // "Decimal" display mode: show 1.732050808 instead of sqrt(3).
    if (decimalMode) { const num = numericRootDisplay(orig); if (num) return num; }
  } catch {}
  return { text: disp(s), tex: safeTeXStr(s), real: !/\bi\b/.test(s) };
}

/* Clean up nerdamer's approximate solutions (degree ≥ 3 fallback) */
function cleanSolution(part) {
  nerdExact();   // often called right after nerdamer.solve, which flips PARSE2NUMBER
  const d = disp(part);
  if (/\d{6,}/.test(part)) {                  // rationalised approximation → round it
    try {
      const num = numericRootDisplay(math.evaluate(d, numScope));
      if (num) return num;
    } catch {}
  }
  if (decimalMode) {
    try {
      const num = numericRootDisplay(math.evaluate(d, numScope));
      if (num) return num;
    } catch {}
  }
  return { text: d, tex: safeTeXStr(part), real: !/\bi\b/.test(d) };
}

/* mathjs's ^ operator always uses the complex principal branch for a fractional
   exponent, so (-8)^(1/3) numerically comes out as a complex number instead of
   the real -2 that an odd root of a negative number should give. Rewrite that
   specific literal pattern to mathjs's dedicated nthRoot(), which gets it right —
   but only for numeric evaluation; nerdamer (used for symbolic/equation solving)
   doesn't know nthRoot(), so the original ^(1/n) form must stay untouched there. */
function preferRealOddRoot(expr) {
  // Covers the various bracket shapes latexToExpr can produce for the same math:
  // \sqrt[3]{-8} → "1/(3)", (-8)^{1/3} → "1/3", (-8)^{\frac{2}{3}} → "(2)/(3)".
  // General base^(m/n): take the (correctly real, odd-n) root first, then raise
