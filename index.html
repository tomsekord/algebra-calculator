  // to the m power — e.g. (-8)^(2/3) = (nthRoot(-8,3))^2 = 4, not a complex number.
  let out = expr.replace(/\(*(-?\d+(?:\.\d+)?)\)*\^\(+\(?(\d+)\)?\/\(?(\d+)\)?\)+/g, (match, base, m, n) => {
    const nn = parseInt(n, 10), mm = parseInt(m, 10);
    return (Number(base) < 0 && nn % 2 === 1) ? `(nthRoot(${base},${nn}))^${mm}` : match;
  });
  let opens = 0, closes = 0;
  for (const ch of out) { if (ch === '(') opens++; else if (ch === ')') closes++; }
  while (closes > opens && out.endsWith(')')) { out = out.slice(0, -1); closes--; }
  return out;
}

function isCleanNumber(x) { return /^-?\d+(\/\d+)?$/.test(fmtNum(x)); }

/* In Exact mode, a plain expression like "sqrt(3)" or "e" should stay
   symbolic instead of showing mathjs's decimal — but mathjs always
   evaluates successfully first (no exception to fall back from), so
   plainExpr has to explicitly ask nerdamer for a cleaner form and
   double-check it actually means the same number before trusting it.
   `val` may be a plain number or a mathjs Complex (e.g. sqrt(-3) in
   Complex mode) — same logic either way, just comparing both parts. */
function tryExactForm(expr, val) {
  const valRe = val && val.isComplex ? val.re : val;
  const valIm = val && val.isComplex ? val.im : 0;
  if (isCleanNumber(valRe) && (valIm === 0 || isCleanNumber(valIm))) return null;   // already clean
  try {
    const s = nerdamer(expr); const str = s.toString();
    const dstr = disp(str);
    if (/^-?\d+(\.\d+)?$/.test(dstr)) return null;         // nerdamer also just gives a plain number
    // A long digit run means nerdamer merely rationalized a decimal into a
    // giant fraction (e.g. "1.5707963…" → 31415…/20000…) — that's not a
    // genuinely exact form, it's the same decimal wearing a costume.
    if (/\d{6,}/.test(dstr)) return null;
    const check = math.evaluate(dstr, numScope);
    const checkRe = check && check.isComplex ? check.re : (typeof check === 'number' ? check : NaN);
    const checkIm = check && check.isComplex ? check.im : 0;
    if (!isFinite(checkRe) || Math.abs(checkRe - valRe) > 1e-6 || Math.abs(checkIm - valIm) > 1e-6) return null;
    // `raw` keeps nerdamer's own (un-disp'd) string so callers can feed it
    // back into nerdamer.setVar without losing the exact form.
    return { tex: safeTeX(s), text: dstr, cls: 'sym', raw: str };
  } catch { return null; }
}

/* Decimal-mode counterpart for expressions that still have a free variable
   (e.g. "e*sqrt(3)*x"): nerdamer's .evaluate() does turn the numeric part
   into a number while leaving the variable alone, but — same rationalizing
   quirk as elsewhere in this file — it comes back as an ugly fraction like
   "(315761972/67066357)*x" instead of "4.708202236*x". Fix up every
   pure-digit fraction in both the string and TeX forms nerdamer already
   generated, rather than the whole expression (the variable part must stay
   untouched) — and critically, without ever re-parsing the fixed-up text
   back through nerdamer, which would just rationalize the decimal right
   back into an ugly fraction again. */
function toDecimalLiteral(n, d) {
  const val = Number(n) / Number(d);
  return isFinite(val) ? parseFloat(val.toPrecision(10)).toString() : null;
}
/* Walk \frac{numerator}{denominator} pairs in a TeX string with proper brace
   depth tracking (a regex like [^}]* breaks the moment the numerator has its
   own nested braces, e.g. "315761972 \cdot x^{2}" — the exponent's "}" ends
   the match early and desyncs the rest of the parse). Converts only the
   pairs whose numerator starts with a digit run and whose denominator is
   pure digits, leaving everything else (including any surrounding variable
   part inside the numerator) untouched. */
function fracsToDecimalTeX(tex) {
  let out = '', i = 0;
  const MARK = '\\frac{';
  while (i < tex.length) {
    const idx = tex.indexOf(MARK, i);
    if (idx === -1) { out += tex.slice(i); break; }
    out += tex.slice(i, idx);
    const readBraced = start => {   // start points just past an opening '{'
      let depth = 1, p = start;
      while (p < tex.length && depth > 0) { if (tex[p] === '{') depth++; else if (tex[p] === '}') depth--; if (depth > 0) p++; }
      return { content: tex.slice(start, p), end: p + 1 };   // end is just past the matching '}'
    };
    const num = readBraced(idx + MARK.length);
    if (tex[num.end] !== '{') { out += tex.slice(idx, num.end); i = num.end; continue; }
    const den = readBraced(num.end + 1);
    const numMatch = num.content.match(/^(-?\d+)([\s\S]*)$/);
    const dec = numMatch && /^\d+$/.test(den.content) ? toDecimalLiteral(numMatch[1], den.content) : null;
    out += dec == null ? tex.slice(idx, den.end) : dec + numMatch[2];
    i = den.end;
  }
  return out;
}
function tryDecimalCoeffForm(expr) {
  try {
    const evalObj = nerdamer(expr).evaluate();
    nerdExact();
    let text = disp(evalObj.toString())
      .replace(/(-?\d+)\/(\d+)/g, (m, n, d) => toDecimalLiteral(n, d) ?? m)
      .replace(/\((-?[\d.]+)\)/g, '$1');   // drop redundant parens left around a bare decimal
    const isPureNumber = /^-?\d+(\.\d+)?$/.test(text);
    let tex;
    try { tex = fracsToDecimalTeX(disp(evalObj.toTeX())); }
    catch { tex = text.replace(/\*/g, ' \\cdot '); }
    return { tex, text, cls: isPureNumber ? 'num' : 'sym' };
  } catch { nerdExact(); return null; }
}

function plainExpr(expr) {
  let mErr;
  try {
    const val = math.evaluate(preferRealOddRoot(expr), numScope);
    if (val !== undefined) {
      if (typeof val === 'number' && isFinite(val)) {
        // In Exact mode, prefer a clean symbolic form (sqrt(3), e, ...) over
        // the decimal mathjs always computes first — but only bother when
        // the decimal doesn't already look clean (no point re-deriving "5").
        if (!decimalMode) {
          const exact = tryExactForm(expr, val);
          if (exact) return exact;
        }
        return { tex: fmtNumTeX(val), text: fmtNum(val), cls: 'num' };
      }
      if (val && val.isComplex) {
        if (!complexMode && Math.abs(val.im) > 1e-12)
          return { text: 'This needs an imaginary number — turn on ℂ Complex mode (top right) to see it.', cls: 'err' };
        if (!decimalMode) {
          const exact = tryExactForm(expr, val);
          if (exact) return exact;
        }
        return { tex: complexTeX(val), text: fmtMath(val), cls: 'num' };
      }
      if (typeof val === 'number' && !isFinite(val)) {
        if (Number.isNaN(val) || expr.includes('/')) return { text: 'That’s undefined — probably dividing by zero.', cls: 'err' };
        return { text: 'That number is too big for me to calculate exactly.', cls: 'err' };
      }
      return { text: fmtMath(val), cls: null };
    }
  } catch (e) { mErr = e; }
  // Factorial of a negative number: mathjs already gives a clear reason — use it
  // instead of falling through to nerdamer's unhelpful unevaluated "factorial(-1)".
  if (mErr && /non-negative/i.test(mErr.message))
    return { text: 'That’s undefined — factorial only works on non-negative numbers.', cls: 'err' };

  try {
    const s = nerdamer(expr); const str = s.toString();
    const dstr = disp(str);
    // A lone variable (e.g. `i` or `x` on its own) has nothing to compute → show nothing
    if (/^[a-zA-Z]\w*$/.test(dstr)) return { text: null };
    // The variables cancelled out and left a plain number (e.g. x^0, x/x) → color it like a number
    if (/^-?\d+(\.\d+)?$/.test(dstr)) return { tex: dstr, text: dstr, cls: 'num' };
    if (str) {
      // In Decimal mode, an expression that still has a free variable (so it
      // never reached the plain-number branch above) should still turn its
      // numeric part into a decimal — e.g. "e*sqrt(3)*x" → "4.708202236x",
      // not stay as "e*sqrt(3)*x" just because x has no value.
      if (decimalMode) { const dec = tryDecimalCoeffForm(expr); if (dec) return dec; }
      return { tex: safeTeX(s), text: dstr, cls: 'sym' };
    }
  } catch {}
  // Undefined variable(s) with nothing to simplify → stay quiet rather than error
  if (mErr && /undefined symbol/i.test(mErr.message)) return { text: null };
  throw mErr || new Error('Cannot evaluate');
}

/* ============================================================
   Symbolic word-commands
============================================================ */
function symbolicCmd(name, inner) {
  let out;
  if (name === 'factor')   out = nerdamer.factor(inner);
  // .expand() METHOD, not nerdamer.expand(str): the static form rationalizes
  // radicals (expand(sqrt(2)*(x+1)) → 178447502/30616751-style fractions),
  // the method keeps them exact.
  if (name === 'expand')   out = nerdamer(inner).expand();
  if (name === 'simplify') out = nerdamer(inner).simplify();
  const str = out.toString();
  // nerdamer's expand/simplify can rationalize an irrational coefficient
  // into a giant ugly fraction (same quirk worked around in rootFromExpr) —
  // a clean decimal is strictly more readable than that, so fall back to one
  // whenever this happens, even in Exact mode where we'd otherwise leave the
  // symbolic form alone.
  if (decimalMode || /\d{6,}/.test(str)) {
    const dec = tryDecimalCoeffForm(str);
    if (dec) return dec;
  }
  return { tex: safeTeX(out), text: disp(str), cls: 'sym' };
}

/* ============================================================
   Calculus (from LaTeX notation)
============================================================ */
function evalDerivative(latex) {
  const m = latex.match(/\\frac\{d\}\{d\s*([a-zA-Z]|\\[a-zA-Z]+)\}/);
  if (!m) throw new Error('Bad derivative');
  const v = aliasVar(greekName(m[1]), complexMode);
  const operandLatex = latex.slice(m.index + m[0].length);
  const operand = stripOuter(latexToExpr(operandLatex, complexMode));
  if (!operand) return { text: 'Type something after d/dx to take its derivative.', cls: 'err' };
  const d = nerdamer.diff(operand, v);
  const s = nerdamer(d.toString()).simplify();
  if (decimalMode) { const dec = tryDecimalCoeffForm(s.toString()); if (dec) return dec; }
  return { tex: safeTeX(s), text: disp(s.toString()), cls: 'sym' };
}

function evalIntegral(latex) {
  // MathQuill re-serializes single-character sub/superscripts without braces
  // (e.g. "_0^1" instead of "_{0}^{1}") once you re-read .latex() after any
  // edit — so bounds must be matched as EITHER "{...}" OR a single bare token.
  const m = latex.match(/\\int(?:_(\{[^}]*\}|[^\s{}]))?(?:\^(\{[^}]*\}|[^\s{}]))?/);
  const unwrap = s => s == null ? null : (s[0] === '{' ? s.slice(1, -1) : s);
  // \int also always carries hidden limit slots that render invisible when
  // untouched but can serialize as whitespace ("_{ }^{ }") rather than being
  // omitted — treat blank/whitespace-only bounds as "no bounds given"
  // (indefinite integral), not as an actual 0-to-0 definite integral.
  const rawLower = unwrap(m[1]), rawUpper = unwrap(m[2]);
  const lowerL = rawLower && rawLower.trim() ? rawLower : null;
  const upperL = rawUpper && rawUpper.trim() ? rawUpper : null;
  let rest = latex.slice(m.index + m[0].length);

  const dm = rest.match(/(.*)d\s*([a-zA-Z])\s*$/s);

  const operand = stripOuter(latexToExpr(body, complexMode)) || '1';

  if (lowerL != null && upperL != null) {           // definite → numeric
    const lo = math.evaluate(stripOuter(latexToExpr(lowerL, complexMode)), numScope);
    const hi = math.evaluate(stripOuter(latexToExpr(upperL, complexMode)), numScope);
    const val = simpson(x => math.evaluate(operand, { ...numScope, [v]: x }), lo, hi);
    return { tex: fmtNumTeX(val), text: fmtNum(val), cls: 'num' };

  const I = nerdamer.integrate(operand, v);          // indefinite → symbolic
  if (decimalMode) {
    const dec = tryDecimalCoeffForm(I.toString());
    if (dec) return { tex: dec.tex + ' + C', text: dec.text + ' + C', cls: dec.cls };

function evalSum(latex) {

  const m = latex.match(/\\sum_\{([a-zA-Z])\s*=\s*([^}]*)\}\^\{([^}]*)\}/);
  if (!m || !m[3].trim()) return { text: HELP, cls: 'err' };   // empty top limit → Tab was never pressed
  const v = aliasVar(m[1], complexMode);

    lo = Math.round(math.evaluate(stripOuter(latexToExpr(m[2], complexMode)), numScope));
    hi = Math.round(math.evaluate(stripOuter(latexToExpr(m[3], complexMode)), numScope));
  } catch { return { text: HELP, cls: 'err' }; }
  if (!isFinite(lo) || !isFinite(hi)) return { text: HELP, cls: 'err' };

  const body = stripOuter(latexToExpr(rest, complexMode)) || '0';

function evalLimit(latex) {
  const HELP = 'Type a limit like lim as x→0, then the expression to approach it with.';
  const m = latex.match(/\\lim_\{([a-zA-Z]|\\[a-zA-Z]+)\\to\s*(-)?(\\infty|[^}]*)\}/);
  if (!m) return { text: HELP, cls: 'err' };
  const v = aliasVar(greekName(m[1]), complexMode);
  const neg = !!m[2];
  const targetLatex = m[3];
  const rest = latex.slice(m.index + m[0].length);
  const body = stripOuter(latexToExpr(rest, complexMode));
  if (!body) return { text: 'Type an expression after the limit to evaluate it.', cls: 'err' };

  let point;
  if (targetLatex === '\\infty') {
    point = neg ? -Infinity : Infinity;
  } else {
    try { point = Number(math.evaluate(stripOuter(latexToExpr(targetLatex, complexMode)), numScope)); }
    catch { return { text: 'Couldn’t understand what value to approach — try a plain number.', cls: 'err' }; }
    if (neg) point = -point;
    if (!isFinite(point)) return { text: HELP, cls: 'err' };
  }

  // Track whether evaluation failed because of a genuinely undefined name
  // (e.g. an undefined function like f in "lim h->0 (f(x+h)-f(x))/h") rather
  // than the function actually blowing up — those deserve a very different
  // message than "the limit doesn't exist".
  let undefinedRef = null;
  const f = x => {
    try { const r = math.evaluate(body, { ...numScope, [v]: x }); return typeof r === 'number' ? r : NaN; }
    catch (e) { if (/undefined/i.test(e.message || '')) undefinedRef = e.message; return NaN; }
  };
  const undefinedMsg = () => ({ text: `Can't evaluate this limit numerically — ${undefinedRef}. Define any functions it uses (like "f(x) = ...") on another line first, or write out the actual formula.`, cls: 'err' });
  // Finite-difference estimates near a limit inherently carry floating-point
  // noise (e.g. 1.999999994 instead of 2) — snap results that are extremely
  // close to a whole number, since that noise is far smaller than any
  // legitimately-fractional answer would be.
  const snap = v => Math.abs(v - Math.round(v)) < 1e-6 ? Math.round(v) : v;
  const numResult = val => ({ tex: fmtNumTeX(snap(val)), text: fmtNum(snap(val)), cls: 'num' });

  if (!isFinite(point)) {                    // x → ±∞
    const dir = point > 0 ? 1 : -1;
    const [a, b, c] = [1e4, 1e6, 1e8].map(mag => f(dir * mag));
    if ([a, b, c].every(isFinite) && Math.abs(c - b) < 1e-6 * Math.max(1, Math.abs(c)))
      return numResult(c);
    if ([a, b, c].every(isFinite) && Math.abs(c) > Math.abs(b) && Math.abs(b) > Math.abs(a) && Math.abs(c) > 1e6)
      return { text: `The limit diverges to ${Math.sign(c) > 0 ? '+∞' : '−∞'}.`, cls: 'sym' };
    if (undefinedRef) return undefinedMsg();
    return { text: 'Couldn’t determine that limit numerically — try simplifying the expression first.', cls: 'err' };
  }

  const direct = f(point);
  if (isFinite(direct)) return numResult(direct);   // continuous at the point → limit = f(point)

  // Indeterminate/undefined right at the point — approach from both sides.
  const hs = [1e-2, 1e-4, 1e-6, 1e-8];
  const L = hs.map(h => f(point - h));
  const R = hs.map(h => f(point + h));
  const lOK = L.every(isFinite), rOK = R.every(isFinite);
  if (lOK && rOK) {
    const lSettled = Math.abs(L[3] - L[2]) < 1e-4 * Math.max(1, Math.abs(L[3]));
    const rSettled = Math.abs(R[3] - R[2]) < 1e-4 * Math.max(1, Math.abs(R[3]));
    if (lSettled && rSettled) {
      if (Math.abs(L[3] - R[3]) < 1e-4 * Math.max(1, Math.abs(L[3]), Math.abs(R[3])))
        return numResult((L[3] + R[3]) / 2);
      return { text: `The limit doesn’t exist — from the left it approaches ${fmtNum(L[3])}, but from the right it approaches ${fmtNum(R[3])}.`, cls: 'err' };
    }
  }
  const growing = arr => arr.every(isFinite) && Math.abs(arr[3]) > Math.abs(arr[2]) && Math.abs(arr[2]) > Math.abs(arr[1]) && Math.abs(arr[3]) > 1e6;
  if (growing(L) || growing(R) || !lOK || !rOK) {
    if (undefinedRef) return undefinedMsg();
    const ls = Math.sign(L.slice().reverse().find(isFinite) || (L.every(v => !isFinite(v)) ? 0 : NaN));
    const rs = Math.sign(R.slice().reverse().find(isFinite) || (R.every(v => !isFinite(v)) ? 0 : NaN));
    if (ls && rs && ls === rs) return { text: `The limit diverges to ${ls > 0 ? '+∞' : '−∞'}.`, cls: 'sym' };
    return { text: 'The limit doesn’t exist — the function blows up differently from each side.', cls: 'err' };
  }
  if (undefinedRef) return undefinedMsg();
  return { text: 'Couldn’t determine that limit numerically — try simplifying the expression first.', cls: 'err' };
}

/* Simpson's rule for definite integrals */
function simpson(f, a, b, n = 1000) {
  if (a === b) return 0;
  const h = (b - a) / n; let s = f(a) + f(b);
  for (let i = 1; i < n; i++) s += (i % 2 ? 4 : 2) * f(a + i * h);
  return s * h / 3;
}

/* ============================================================
   Numeric fallback equation solver (Newton)
============================================================ */
/* Real roots of f(x)=0, nearest-to-zero first (Newton's method from many starting points) */
function findRealRoots(f) {
  const starts = [-1e3,-200,-50,-20,-10,-5,-3,-2,-1,-.5,0,.5,1,2,3,5,10,20,50,200,1e3];
  const found = [];
  for (const x0 of starts) {
    const s = newton(f, x0);
    if (s !== null) { const r = Math.round(s*1e9)/1e9; if (!found.some(q => Math.abs(q-r)<1e-6)) found.push(r); }
  }
  found.sort((a, b) => Math.abs(a) - Math.abs(b));

}

/* |...| = -5 (or -|...| = 5) can never work out — not in real numbers, not in
   complex numbers either, since absolute value/modulus is always ≥ 0. Say so
   directly instead of letting Newton's method fail silently. */

  const L = stripOuter(lhs), R = stripOuter(rhs);
  for (const [absSide, otherSide] of [[L, R], [R, L]]) {
    const negMatch = absSide.match(/^-\s*abs\(.+\)$/);
    const plainMatch = absSide.match(/^abs\(.+\)$/);
    if (!negMatch && !plainMatch) continue;
    let c;
    try { c = math.evaluate(otherSide, numScope); } catch { continue; }
    if (typeof c !== 'number' || !isFinite(c)) continue;
    const impossible = negMatch ? c > 0 : c < 0;
    if (impossible) return { text: 'No solution — absolute value is never negative, so this can’t work out in any number system.', cls: null };
  }
  return null;
}

/* sin(y)=1, cos(y)=0.5, tan(y)=2, etc. — give the one principal answer
   instead of Newton's method finding a pile of periodic repeats. In Complex
   mode, sin/cos targets outside [-1,1] (e.g. sin(x)=2) have no real answer
   but do have a complex one — math.asin/acos already return a Complex value

  if (stripOuter(m[2]) !== v) return null;   // only bare sin(y), not sin(2y+1)

  try { c = math.evaluate(constSide, numScope); } catch { return null; }
  if (typeof c !== 'number' || !isFinite(c)) return null;

  const fn = m[1];
  const outOfRealRange = (fn === 'sin' || fn === 'cos') && Math.abs(c) > 1;
  if (outOfRealRange && !complexMode)
    return { text: `No real number solves this — ${fn} only ever gives values between −1 and 1. Try ℂ Complex mode to see a complex answer.`, cls: null };

  const val = outOfRealRange
    ? (fn === 'sin' ? math.asin(c) : math.acos(c))       // math.js promotes to Complex here
    : (fn === 'sin' ? Math.asin(c) : fn === 'cos' ? Math.acos(c) : Math.atan(c));

function numericSolve(lhs, rhs, v) {
  const f = x => { try { return math.evaluate(lhs, { ...numScope, [v]: x }) - math.evaluate(rhs, { ...numScope, [v]: x }); } catch { return NaN; } };
  const found = findRealRoots(f);

  // on plain JS numbers) — it has no way to find a complex one. Saying
  // "couldn't find a real number" implies a complex answer might still be
  // out there, which is misleading: in Complex mode it's not even true (we
  // never looked for one), and even in Real mode it overpromises when there
  // may be no solution in either number system.
  if (!found.length) return { text: complexMode
    ? 'Couldn’t find a number that solves this, even searching numerically — it may have no solution.'
    : 'Couldn’t find a real number that solves this numerically. Try ℂ Complex mode — though it may not have a solution there either.',
    cls: null };

  const shown = found.slice(0, 6).sort((a, b) => a - b);

  // (|x|=5 → exactly ±5) has earned a real "=" instead of "≈".
  const exact = s => isCleanNumber(s) && Math.abs(f(s)) < 1e-9;
  registerMultiValue(v, shown.map(s => exact(s)
    ? { text: fmtNum(s), tex: fmtNumTeX(s) }
    : { text: `≈ ${fmtNum(s)}`, tex: `\\approx ${fmtNumTeX(s)}` }));
  const parts = shown.map(s => `${dispTeX(v)} ${exact(s) ? '=' : '\\approx'} ${fmtNumTeX(s)}`);
  if (found.length > 6) parts.push('\\dots');
  return {
    parts,
    text: shown.map(s => `${dv} ${exact(s) ? '=' : '≈'} ${fmtNum(s)}`).join('   or   ') + (found.length > 6 ? '   …' : ''),
    cls: 'num',

function newton(f, x0, it = 80) {

    if (Math.abs(fx) < 1e-12) return x;
    const h = Math.max(1e-7, Math.abs(x)*1e-6), d = (f(x+h)-fx)/h;
    if (!isFinite(d) || Math.abs(d) < 1e-15) { x += (Math.random()-.5)*.5; continue; }
    x -= fx/d; if (!isFinite(x)) return null;

/* ============================================================
   LaTeX  →  evaluable expression
============================================================ */
function latexToExpr(tex, complex) {
  if (!tex) return '';

    .replace(/\\left\|/g, '\\abs{').replace(/\\right\|/g, '}')
    .replace(/\\left\[/g, '(').replace(/\\right\]/g, ')')
    .replace(/\\left\\\{/g, '(').replace(/\\right\\\}/g, ')')
    .replace(/\\left\./g, '(').replace(/\\right\./g, ')')
    .replace(/\\left/g, '').replace(/\\right/g, '')
    .replace(/\\,/g, ' ').replace(/\\!/g, '').replace(/\\;/g, ' ').replace(/\\ /g, ' ')
    .replace(/\\cdot/g, '*').replace(/\\times/g, '*').replace(/\\div/g, '/');

  let i = 0;

  function parseArg() {
    while (s[i] === ' ') i++;
    const c = s[i];
    if (c === '{') { i++; const inner = parseSeq('}'); if (s[i] === '}') i++; return '(' + inner + ')'; }
    if (c === '(') { i++; const inner = parseSeq(')'); if (s[i] === ')') i++; return '(' + inner + ')'; }
    if (c === '\\') return '(' + parseCommand() + ')';
    if (c === undefined) return '()';
    return '(' + s[i++] + ')';
  }

  function grabBrace() {
    while (s[i] === ' ') i++;
    if (s[i] === '{') { i++; let t = ''; let d = 1; while (i < s.length && d) { if (s[i]==='{')d++; else if (s[i]==='}'){d--; if(!d){i++;break;}} t += s[i++]; } return t; }
    return '';
  }

  function parseCommand() {
    i++;
    if (!/[a-zA-Z]/.test(s[i] || '')) return s[i++] || '';
    let name = '';
    while (i < s.length && /[a-zA-Z]/.test(s[i])) name += s[i++];
    if (name === 'operatorname') name = grabBrace();   // \operatorname{fn} → treat fn directly
    switch (name) {
      case 'frac': case 'dfrac': case 'tfrac': { const a = parseArg(), b = parseArg(); return '(' + a + '/' + b + ')'; }
      case 'sqrt': {
        while (s[i] === ' ') i++;
        if (s[i] === '[') { i++; const n = parseSeq(']'); if (s[i] === ']') i++; const x = parseArg(); return '((' + x + ')^(1/(' + n + ')))'; }
        return 'sqrt' + parseArg();

      case 'abs': return 'abs' + parseArg();
      case 'ln': return 'log' + parseArg();
      case 'log': {
        while (s[i] === ' ') i++;

        if (s[i] === '_') { i++; base = stripOuter(parseArg()); }
        return 'log(' + stripOuter(parseArg()) + ',' + base + ')';

      case 'pi': return 'pi';
      case 'tau': return '(2*pi)';
      case 'cdot': case 'times': return '*';
      case 'div': return '/';
      case 'infty': return 'Infinity';
      case 'theta': case 'vartheta': return 'theta';
      case 'alpha': case 'beta': case 'gamma': case 'delta': case 'epsilon':
      case 'varepsilon': case 'zeta': case 'eta': case 'iota': case 'kappa':
      case 'lambda': case 'mu': case 'nu': case 'xi': case 'rho': case 'varrho':
      case 'sigma': case 'phi': case 'varphi': case 'chi': case 'psi': case 'omega':
        return name;
      case 'sin': case 'cos': case 'tan': case 'sec': case 'csc': case 'cot':
      case 'arcsin': case 'arccos': case 'arctan':
      case 'sinh': case 'cosh': case 'tanh':
      case 'sign': case 'floor': case 'ceil': case 'round':
      case 'gcd': case 'lcm': case 'mod': case 'det': case 'factorial':
      case 'factor': case 'expand': case 'simplify':

    }

    let out = '', lastVal = false;
    const V = str => { if (lastVal) out += '*'; out += str; lastVal = true; };
    const O = str => { out += str; lastVal = false; };
    while (i < s.length) {
      const c = s[i];
      if (stop && stop.indexOf(c) >= 0) break;
      if (c === '}' || c === ')') break;
      if (/[0-9.]/.test(c)) { let n = ''; while (i < s.length && /[0-9.]/.test(s[i])) n += s[i++]; V(n); continue; }
      if (/[a-zA-Z]/.test(c)) {
        const name = s[i++];
        // f(x) → a real function call, not "f * (x)", when f is a name the user
        // has defined with "f(x) = ..." somewhere. Anything else keeps the old
        // implicit-multiplication behavior (e.g. "x(y+1)" stays x*(y+1)).
        if (s[i] === '(' && knownFunctionNames.has(name)) {
          i++; const inner = parseSeq(')'); if (s[i] === ')') i++;
          V(name + '(' + inner + ')');
        } else V(name);
        continue;
      }
      if (c === '(') { i++; const inner = parseSeq(')'); if (s[i] === ')') i++; V('(' + inner + ')'); continue; }
      if (c === '{') { i++; const inner = parseSeq('}'); if (s[i] === '}') i++; V('(' + inner + ')'); continue; }
      if (c === '^') { i++; out += '^' + parseArg(); lastVal = true; continue; }
      if (c === '_') { i++; const sub = stripOuter(parseArg()).replace(/[^a-zA-Z0-9]/g, ''); out += sub; lastVal = true; continue; }
      if (c === '+' || c === '-' || c === '/' || c === '=' || c === ',' || c === '*') { O(c); i++; continue; }
      if (c === ' ') { i++; continue; }
      if (c === '\\') { const r = parseCommand(); if (r === '*' || r === '/') O(r); else V(r); continue; }
      O(c); i++;

    return out;
  }

  let expr = parseSeq(null);
  // A letter immediately followed by "(" here is a real function call (only
  // produced above for names in knownFunctionNames) — not a variable, so it
  // shouldn't get renamed to dodge mathjs's unit collisions. Without the
  // (?!\() guard, "g(x) = ..." (g collides with the gram unit) would rename
  // its own function name mid-definition and break parsing of that very line.
  if (!complex) expr = expr.replace(/\bi\b(?!\()/g, IVAR);
  for (const [letter, alias] of Object.entries(UNIT_ALIASES)) {
    expr = expr.replace(new RegExp(`\\b${letter}\\b(?!\\()`, 'g'), alias);
  }
  return expr;
}

/* ============================================================
   Helpers
============================================================ */
const BUILTINS = new Set([
  'sin','cos','tan','sec','csc','cot','asin','acos','atan','arcsin','arccos','arctan',
  'sinh','cosh','tanh','sqrt','cbrt','exp','log','log2','log10','ln',
  'abs','ceil','floor','round','sign','factorial','gamma','nthRoot',
  'min','max','sum','mean','mod','pow','gcd','lcm','det','re','im','arg','conj',
  'pi','e','tau','phi','Infinity','NaN','true','false',
  'factor','expand','simplify','integrate','derivative','diff','C',

  if (Math.abs(x - r) < 1e-10) return String(r);
  if (!decimalMode)
    for (let d = 2; d <= 1000; d++) { const n = Math.round(x*d); if (n !== 0 && Math.abs(n/d - x) < 1e-9 && Math.abs(n) <= d*25) return `${n}/${d}`; }
  return parseFloat(x.toPrecision(10)).toString();
}
function fmtNumTeX(x) {
  if (typeof x !== 'number' || !isFinite(x)) return String(x);
  const r = Math.round(x);
  if (Math.abs(x - r) < 1e-10) return String(r);
  if (!decimalMode)
    for (let d = 2; d <= 1000; d++) { const n = Math.round(x*d); if (n !== 0 && Math.abs(n/d - x) < 1e-9 && Math.abs(n) <= d*25) return `\\frac{${n}}{${d}}`; }
  return parseFloat(x.toPrecision(10)).toString();
}
function complexTeX(v) {
  if (v.im === 0) return fmtNumTeX(v.re);
  const absIm = Math.abs(v.im);
  const imStr = absIm === 1 ? 'i' : `${fmtNum(absIm)}i`;
  if (v.re === 0) return (v.im < 0 ? '-' : '') + imStr;
  return `${fmtNum(v.re)} ${v.im >= 0 ? '+' : '-'} ${imStr}`;
}
function fmtMath(v) {
  if (v == null) return '';
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'number') return fmtNum(v);
  if (typeof v === 'string') return `"${v}"`;
  if (v.isUnit) return v.toString();
  if (v.isMatrix) { const a = v.toArray(); const f = r => Array.isArray(r) ? '['+r.map(fmtNum).join(', ')+']' : fmtNum(r); return '['+a.map(f).join(',  ')+']'; }
  if (v.isComplex) {
    if (v.im === 0) return fmtNum(v.re);
    const absIm = Math.abs(v.im);
    const imStr = absIm === 1 ? 'i' : `${fmtNum(absIm)}i`;
    if (v.re === 0) return (v.im < 0 ? '−' : '') + imStr;
    return `${fmtNum(v.re)} ${v.im >= 0 ? '+' : '−'} ${imStr}`;
  }
  try { return JSON.stringify(v); } catch { return String(v); }
}
function niceError(msg = '') {
  const m = disp(msg);
  const bad = m.match(/undefined symbol\s*(\S+)/i);
  if (bad) return `I don't recognize "${bad[1]}" — check the spelling or pick it from the keyboard below.`;
  if (/unexpected|cannot read prop/i.test(m)) return 'That doesn’t look like valid math — check for typos or a missing symbol.';
  if (/cannot evaluate/i.test(m)) return 'I couldn’t work that out — check your expression.';
  if (/maximum call stack/i.test(m)) return 'That function calls itself — make sure its formula doesn’t use its own name.';
  return 'Something’s not right here — check your typing.';
}

/* ── UI ── */
function allLines() { return [...document.querySelectorAll('#lines .line')]; }
function renumber() { allLines().forEach((l, i) => l.querySelector('.lnum').textContent = i + 1); }
function updateStatus() { document.getElementById('lineCount').textContent = allLines().length; }

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePalette(); });

window.addEventListener('beforeunload', e => {
  const hasContent = allLines().some(l => l._mq && l._mq.latex().trim() !== '');
  if (!hasContent) return;
  e.preventDefault();
  e.returnValue = 'If you leave this page your changes will be lost.';
});
</script>
